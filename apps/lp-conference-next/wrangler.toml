# lp-conference-next — public conference LP (Next.js SSG rebuild) delivered as a
# SEPARATE Cloudflare Worker (承認済み設計: 公開LPは認証済み管理面とは別Worker).
# The LP never calls internal services / admin APIs live, except reading the
# publish flag (which version is public) from dub-lp-analytics.
#
# Multi-version: dist-bundle/ holds every version in versions.json
# (versions/<id>/ = HTML + public files, _v/<id>/_next/ = chunks). worker/index.ts
# serves the published version (flag via LP_FLAG, cached 30s, fallback
# DEFAULT_VERSION) and `?version=3.1` previews (session cookie + noindex + banner).
# /_v/* skips the Worker (served straight from assets = no request quota used).
#
# Deploy (PRODUCTION — only with explicit owner approval):
#   pnpm --filter @dub/lp-conference-next build:bundle
#   export CLOUDFLARE_API_TOKEN=$(cat ~/DubVault/secrets/cf-token.txt)
#   npx wrangler deploy --config apps/lp-conference-next/wrangler.toml
name = "lp-conference-next"
main = "worker/index.ts"
compatibility_date = "2026-08-01"

[assets]
directory = "./dist-bundle"
binding = "ASSETS"
run_worker_first = ["/*", "!/_v/*"]

# Public custom domain (apex). Cloudflare auto-provisions DNS + TLS.
# apex was free (no existing DNS record) at cutover time.
[[routes]]
pattern = "hokuriku-it-conf.com"
custom_domain = true

# Publish flag: GET https://lp-analytics/lp/internal/publish -> { versionId }.
[[services]]
binding = "LP_FLAG"
service = "dub-lp-analytics"

[vars]
DEFAULT_VERSION = "v3.4"

[observability]
enabled = true
