# MO3 mobile-bff — Cloudflare Worker scaffold (P0: DO NOT DEPLOY from here).
# Separate deploy from api-gateway, same contract (theme6/theme14). Public face is
# m-api.developershub.jp (theme14 D5). Binding names may be renamed by the infra
# binding-name registry (#28) at Apply time — mechanical rename when it lands.
name = "mo3-mobile-bff"
main = "src/index.ts"
compatibility_date = "2024-11-27"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

[observability]
enabled = true

# Public route (theme14 D5: dedicated Worker, api-gateway holds no mobile face).
# routes = [{ pattern = "m-api.developershub.jp/*", zone_name = "developershub.jp" }]

# --- D1: shared dub-core DB, mobile_* namespace only (theme12) ---
[[d1_databases]]
binding = "DB_MOBILE"
database_name = "dub-core"
database_id = "REPLACE_AT_APPLY"

# --- Queue producer: audit-record (theme13 publishAudit; push delivery failure) ---
[[queues.producers]]
binding = "AUDIT_QUEUE"
queue = "dub-q-audit-record"

# --- Queue consumer: mobile-bff domain-event subscription (theme1). ENABLED in the
#     differential-sync wave; handler is a STUB no-op in P0 (change_log not created). ---
[[queues.consumers]]
queue = "dub-q-evt-mobile-bff"
dead_letter_queue = "dub-q-evt-mobile-bff-dlq"
max_batch_size = 10
max_retries = 5

# --- Service bindings (stubbed until 9-x結線) ---
[[services]]
binding = "SVC_AUTH"
service = "auth-service"

[[services]]
binding = "SVC_IDENTITY"
service = "identity-roster"

[[services]]
binding = "SVC_EVENT"
service = "event-service"

[[services]]
binding = "SVC_TASK"
service = "task-service"

[[services]]
binding = "SVC_NOTIFICATION"
service = "notification"

# --- vars (non-secret) ---
[vars]
ENVIRONMENT = "production"
DEFAULT_ORG_ID = "org_devhub"

# Secrets (set via `wrangler secret put`, never committed):
#   APNS_KEY_P8 / APNS_KEY_ID / APNS_TEAM_ID / APNS_BUNDLE_ID   (iOS, p8 JWT)
#   FCM_SERVICE_ACCOUNT_JSON / FCM_PROJECT_ID                    (Android, HTTP v1)
# Push adapters are interface-frozen and stubbed in P0 (theme8/8-9; 9-D wave).

[env.preview.vars]
ENVIRONMENT = "preview"

[env.local.vars]
ENVIRONMENT = "local"
