# OpenAPI 3.1 contract for github-sync. Generated from services/github-sync/src route tables
# and packages/types/src contract namespaces. Envelope: raw JSON on success,
# @dub/errors ErrorResponse on failure. Cursor pagination (opaque cursor + nextCursor).
openapi: 3.1.0
info:
  title: GitHub Sync API
  version: 1.0.0
  description: |-
    Task<->issue links, repo registry and synchronization jobs. External segment /api/v1/github.
    
    All responses echo the correlation id in the x-dub-request-id header.
servers:
  - url: https://gateway.example/api/v1
    description: Public base via api-gateway (external clients call /api/v1/github/...). Paths below are service-internal (post-prefix-strip); the gateway strips /api/v1 before forwarding.
tags:
  - name: github
security:
  - sessionCookie: []
  - gatewayIdentity: []
paths:
  /github/links:
    get:
      operationId: listLinks
      summary: List task<->issue links
      tags:
        - github
      description: Requires github:read.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: taskId
          in: query
          schema:
            type: string
        - name: repo
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Page of links
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedLinks'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createLink
      summary: Create a task<->issue link
      tags:
        - github
      description: Requires github:write.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLinkRequest'
      responses:
        '201':
          description: Created link
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GithubLink'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /github/links/{id}:
    delete:
      operationId: deleteLink
      summary: Delete a link
      tags:
        - github
      description: Requires github:write.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /github/repos:
    get:
      operationId: listRepos
      summary: List registered repos
      tags:
        - github
      description: Requires github:read.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: eventId
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Page of repos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepoList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: registerRepo
      summary: Register a repo
      tags:
        - github
      description: Requires github:admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRepoRequest'
      responses:
        '201':
          description: Registered repo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GithubRepo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /github/repos/{id}:
    patch:
      operationId: updateRepo
      summary: Update a repo
      tags:
        - github
      description: Requires github:admin.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRepoRequest'
      responses:
        '200':
          description: Updated repo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GithubRepo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteRepo
      summary: Deregister a repo
      tags:
        - github
      description: Requires github:admin.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deregistered.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /github/sync:
    post:
      operationId: triggerSync
      summary: Trigger a sync job
      tags:
        - github
      description: Requires github:sync.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TriggerSyncRequest'
      responses:
        '202':
          description: Sync run accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriggerSyncResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /github/sync/runs:
    get:
      operationId: listSyncRuns
      summary: List sync runs
      tags:
        - github
      description: Requires github:read.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of runs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncRunPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /github/sync/runs/{id}:
    get:
      operationId: getSyncRun
      summary: Get a sync run
      tags:
        - github
      description: Requires github:read.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Sync run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncRun'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  schemas:
    Error:
      type: object
      description: Unified error envelope (@dub/errors ErrorResponse). Every non-2xx response uses this shape.
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
            - retryable
          properties:
            code:
              type: string
              description: SCREAMING_SNAKE code. Common set or <SERVICE>_<REASON>.
            message:
              type: string
            details:
              description: Code-specific payload (e.g. FieldError[] for VALIDATION_FAILED, RateLimitDetails for RATE_LIMITED).
            requestId:
              type: string
              description: x-dub-request-id origin.
            service:
              type: string
            retryable:
              type: boolean
    FieldError:
      type: object
      required:
        - field
        - reason
      properties:
        field:
          type: string
          example: title
        reason:
          type: string
          example: required
        message:
          type: string
    RateLimitDetails:
      type: object
      required:
        - retryAfterSec
      properties:
        retryAfterSec:
          type: integer
    GithubLink:
      type: object
      required:
        - taskId
        - repo
        - issueNumber
        - url
        - linkedAt
      properties:
        taskId:
          type: string
        repo:
          type: string
        issueNumber:
          type: integer
        url:
          type: string
        linkedAt:
          type: string
          format: date-time
          description: ISO8601 UTC
    CreateLinkRequest:
      type: object
      required:
        - taskId
        - repo
        - issueNumber
      properties:
        taskId:
          type: string
        repo:
          type: string
        issueNumber:
          type: integer
    PaginatedLinks:
      type: object
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/GithubLink'
        nextCursor:
          type:
            - string
            - 'null'
          description: null = end of results.
    GithubRepo:
      type: object
      description: Registered repo ('owner/name').
      required:
        - id
        - repo
      properties:
        id:
          type: string
        repo:
          type: string
        eventId:
          type:
            - string
            - 'null'
        enabled:
          type: boolean
    RepoList:
      type: object
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/GithubRepo'
        nextCursor:
          type:
            - string
            - 'null'
          description: null = end of results.
    RegisterRepoRequest:
      type: object
      required:
        - repo
      properties:
        repo:
          type: string
        eventId:
          type: string
    UpdateRepoRequest:
      type: object
      properties:
        enabled:
          type: boolean
        eventId:
          type:
            - string
            - 'null'
    TriggerSyncRequest:
      type: object
      required:
        - scope
      properties:
        scope:
          type: string
          enum:
            - task
            - event
            - all
        targetId:
          type: string
        runScope:
          type: string
          enum:
            - incremental
            - full
    SyncRun:
      type: object
      required:
        - id
        - status
        - startedAt
      properties:
        id:
          type: string
        scope:
          type: string
        status:
          type: string
        startedAt:
          type: string
          format: date-time
          description: ISO8601 UTC
        finishedAt:
          type:
            - string
            - 'null'
          format: date-time
    SyncRunPage:
      type: object
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SyncRun'
        nextCursor:
          type:
            - string
            - 'null'
          description: null = end of results.
    TriggerSyncResponse:
      type: object
      required:
        - runId
      properties:
        runId:
          type: string
  responses:
    BadRequest:
      description: VALIDATION_FAILED — request body/query invalid; error.details is FieldError[].
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthenticated:
      description: UNAUTHENTICATED — missing/invalid session.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: FORBIDDEN — authenticated but lacking the required permission.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: NOT_FOUND — resource does not exist (also returned for internal-only paths hit externally).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: CONFLICT / <SERVICE>_VERSION_CONFLICT — optimistic-lock version mismatch or state conflict.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PreconditionFailed:
      description: PRECONDITION_FAILED.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PayloadTooLarge:
      description: PAYLOAD_TOO_LARGE — body exceeds the route cap.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: RATE_LIMITED — error.details is RateLimitDetails; Retry-After header set.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Internal:
      description: INTERNAL — unhandled server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from a previous response's nextCursor.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      description: Page size. Default 50, max 200.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: dub_session
      description: Web session cookie minted by auth-service; verified at the gateway.
    gatewayIdentity:
      type: apiKey
      in: header
      name: x-dub-user-id
      description: Trusted authn header injected by the gateway after session verification (mode:trustedHeader). Internal boundary only — never accepted from the public internet.
