# OpenAPI 3.1 contract for audit-log. Generated from services/audit-log/src route tables
# and packages/types/src contract namespaces. Envelope: raw JSON on success,
# @dub/errors ErrorResponse on failure. Cursor pagination (opaque cursor + nextCursor).
openapi: 3.1.0
info:
  title: Audit Log API
  version: 1.0.0
  description: |-
    Append-only audit trail: synchronous /internal/log for the 5 critical actions, asynchronous /internal/audit-async (outbox drain landing) for the rest, plus authorized search. External segment /api/v1/audit.
    
    All responses echo the correlation id in the x-dub-request-id header.
servers:
  - url: https://gateway.example/api/v1
    description: Public base via api-gateway (external clients call /api/v1/audit/...). Paths below are service-internal (post-prefix-strip); the gateway strips /api/v1 before forwarding.
tags:
  - name: audit
  - name: health
security:
  - sessionCookie: []
  - gatewayIdentity: []
paths:
  /internal/health:
    get:
      operationId: auditHealth
      summary: Liveness probe
      tags:
        - health
      description: 'Internal-only: requires x-dub-internal (service binding). The api-gateway 404s this path for external clients.'
      responses:
        '200':
          description: OK
      security: []
  /internal/log:
    post:
      operationId: writeAuditLog
      summary: Synchronous audit write
      tags:
        - audit
      description: |-
        Only the 5 SYNC_AUDIT_ACTIONS use this synchronous path (deploy + identity permission changes); everything else goes via the Queue publishAudit.
        
        Internal-only: requires x-dub-internal (service binding). The api-gateway 404s this path for external clients.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuditRecordInput'
      responses:
        '201':
          description: Recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogWriteResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
      security: []
  /internal/audit-async:
    post:
      operationId: ingestAuditAsync
      summary: Asynchronous audit ingest (outbox drain landing)
      tags:
        - audit
      description: |-
        Open-catalog async ingest. The free-tier @dub/freeq outbox drain (auth-service and other producers) forwards each due record here over its SVC_AUDIT service binding as an AuditRecordEnvelopeV1 — the same envelope the retired Cloudflare Queue consumer understood. Unlike /internal/log there is no SYNC_AUDIT_ACTIONS gate: this is the landing route for open-vocabulary actions such as auth.session.login / auth.session.logout. The envelope id is the producer idempotency key (INSERT OR IGNORE ⇒ at-least-once re-delivery is safe); a non-2xx makes the drain keep the row pending and retry, so a record is never lost.

        Internal-only: requires x-dub-internal (service binding). The api-gateway 404s this path for external clients.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuditRecordEnvelopeV1'
      responses:
        '202':
          description: Accepted and durably recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogWriteResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
      security: []
  /audit/logs:
    get:
      operationId: queryAuditLog
      summary: Search audit records
      tags:
        - audit
      description: Requires audit:read.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: actorId
          in: query
          schema:
            type: string
        - name: action
          in: query
          schema:
            type: string
        - name: resourceType
          in: query
          schema:
            type: string
        - name: resourceId
          in: query
          schema:
            type: string
        - name: result
          in: query
          schema:
            $ref: '#/components/schemas/AuditResult'
        - name: since
          in: query
          schema:
            type: string
            format: date-time
            description: ISO8601 UTC
        - name: until
          in: query
          schema:
            type: string
            format: date-time
            description: ISO8601 UTC
      responses:
        '200':
          description: Page of records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /audit/logs/{id}:
    get:
      operationId: getAuditRecord
      summary: Get an audit record
      tags:
        - audit
      description: Requires audit:read.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditRecord'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  schemas:
    Error:
      type: object
      description: Unified error envelope (@dub/errors ErrorResponse). Every non-2xx response uses this shape.
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
            - retryable
          properties:
            code:
              type: string
              description: SCREAMING_SNAKE code. Common set or <SERVICE>_<REASON>.
            message:
              type: string
            details:
              description: Code-specific payload (e.g. FieldError[] for VALIDATION_FAILED, RateLimitDetails for RATE_LIMITED).
            requestId:
              type: string
              description: x-dub-request-id origin.
            service:
              type: string
            retryable:
              type: boolean
    FieldError:
      type: object
      required:
        - field
        - reason
      properties:
        field:
          type: string
          example: title
        reason:
          type: string
          example: required
        message:
          type: string
    RateLimitDetails:
      type: object
      required:
        - retryAfterSec
      properties:
        retryAfterSec:
          type: integer
    AuditResult:
      type: string
      enum:
        - success
        - failure
        - denied
        - intent
    AuditRecordInput:
      type: object
      required:
        - action
        - actorId
        - orgId
        - result
        - resourceType
        - resourceId
        - details
        - requestId
        - occurredAt
      properties:
        action:
          type: string
        actorId:
          type:
            - string
            - 'null'
        orgId:
          type: string
        result:
          $ref: '#/components/schemas/AuditResult'
        resourceType:
          type:
            - string
            - 'null'
        resourceId:
          type:
            - string
            - 'null'
        details:
          type:
            - object
            - 'null'
          additionalProperties: true
        requestId:
          type: string
        occurredAt:
          type: string
          format: date-time
          description: ISO8601 UTC
    AuditRecordEnvelopeV1:
      type: object
      description: |-
        The special audit channel envelope (@dub/events AuditRecordEnvelopeV1 / @dub/freeq outbox topic "audit.record"). Delivered to POST /internal/audit-async by the outbox drain. `id` is the producer-assigned idempotency key.
      required:
        - type
        - version
        - id
        - payload
      properties:
        type:
          const: audit.record
        version:
          const: 1
        id:
          type: string
        payload:
          $ref: '#/components/schemas/AuditRecordInput'
    AuditRecord:
      allOf:
        - $ref: '#/components/schemas/AuditRecordInput'
        - type: object
          required:
            - id
            - recordedAt
          properties:
            id:
              type: string
            recordedAt:
              type: string
              format: date-time
              description: ISO8601 UTC
    AuditLogWriteResponse:
      type: object
      required:
        - id
      properties:
        id:
          type: string
    AuditLogPage:
      type: object
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditRecord'
        nextCursor:
          type:
            - string
            - 'null'
          description: null = end of results.
  responses:
    BadRequest:
      description: VALIDATION_FAILED — request body/query invalid; error.details is FieldError[].
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthenticated:
      description: UNAUTHENTICATED — missing/invalid session.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: FORBIDDEN — authenticated but lacking the required permission.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: NOT_FOUND — resource does not exist (also returned for internal-only paths hit externally).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: CONFLICT / <SERVICE>_VERSION_CONFLICT — optimistic-lock version mismatch or state conflict.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PreconditionFailed:
      description: PRECONDITION_FAILED.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PayloadTooLarge:
      description: PAYLOAD_TOO_LARGE — body exceeds the route cap.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: RATE_LIMITED — error.details is RateLimitDetails; Retry-After header set.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Internal:
      description: INTERNAL — unhandled server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from a previous response's nextCursor.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      description: Page size. Default 50, max 200.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: dub_session
      description: Web session cookie minted by auth-service; verified at the gateway.
    gatewayIdentity:
      type: apiKey
      in: header
      name: x-dub-user-id
      description: Trusted authn header injected by the gateway after session verification (mode:trustedHeader). Internal boundary only — never accepted from the public internet.
