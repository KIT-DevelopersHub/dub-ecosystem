# OpenAPI 3.1 contract for task-service. Generated from services/task-service/src route tables
# and packages/types/src contract namespaces. Envelope: raw JSON on success,
# @dub/errors ErrorResponse on failure. Cursor pagination (opaque cursor + nextCursor).
openapi: 3.1.0
info:
  title: Task Service API
  version: 1.0.0
  description: |-
    Optimistic-locked task CRUD and the task_dependencies graph (cycle-checked). External segment /api/v1/tasks.
    
    All responses echo the correlation id in the x-dub-request-id header.
servers:
  - url: https://gateway.example/api/v1
    description: Public base via api-gateway (external clients call /api/v1/tasks/...). Paths below are service-internal (post-prefix-strip); the gateway strips /api/v1 before forwarding.
tags:
  - name: tasks
  - name: health
  - name: internal
security:
  - sessionCookie: []
  - gatewayIdentity: []
paths:
  /health:
    get:
      operationId: taskHealth
      summary: Liveness probe
      tags:
        - health
      responses:
        '200':
          description: OK
      security: []
  /internal/events-async:
    post:
      operationId: taskEventsAsync
      summary: Free-tier consumer landing route (event.archived compensation)
      tags:
        - internal
      description: |-
        Internal-only: requires x-dub-internal (service binding). The api-gateway 404s this path for external clients.

        Free-plan replacement for the retired dub-q-evt-task Cloudflare Queue consumer. On the Workers FREE plan there are no paid Queues, so event-service's own @dub/freeq outbox drain forwards each due event.archived envelope here over its service binding. Runs the same bulk soft-archive compensation and envelope.id idempotency the Queue consumer did (no per-task task.archived fan-out — storm prevention). A non-2xx tells the caller's drain to keep the row pending and retry, so an event is never lost. task-service does NOT call event-service back, so no event↔task cycle is reintroduced.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - id
              properties:
                name:
                  type: string
                  description: Event catalog name (e.g. event.archived).
                id:
                  type: string
                  description: Envelope ULID — the producer idempotency key.
                payload:
                  type: object
                  additionalProperties: true
      responses:
        '202':
          description: Accepted (compensation applied / idempotent no-op)
        '400':
          description: Malformed event envelope
        '404':
          description: Path hit without the x-dub-internal marker (external caller)
  /tasks/dependencies:
    get:
      operationId: listDependencies
      summary: List task dependencies (edges)
      tags:
        - tasks
      description: Requires task:read.
      parameters:
        - name: eventId
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Dependency edges
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaskDependency'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /tasks:
    get:
      operationId: listTasks
      summary: List tasks
      tags:
        - tasks
      description: Requires task:read.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: eventId
          in: query
          schema:
            type: string
        - name: status
          in: query
          description: Repeatable; any of the TaskStatus values.
          schema:
            type: array
            items:
              $ref: '#/components/schemas/TaskStatus'
          style: form
          explode: true
        - name: assigneeId
          in: query
          schema:
            type: string
        - name: includeArchived
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Page of tasks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTasks'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createTask
      summary: Create a task
      tags:
        - tasks
      description: Requires task:write.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
      responses:
        '201':
          description: Created task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /tasks/{id}:
    get:
      operationId: getTask
      summary: Get a task
      tags:
        - tasks
      description: Requires task:read.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateTask
      summary: Update a task (optimistic lock)
      tags:
        - tasks
      description: Requires task:write.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskRequest'
      responses:
        '200':
          description: Updated task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      operationId: deleteTask
      summary: Soft-delete a task
      tags:
        - tasks
      description: Requires task:delete.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /tasks/{id}/dependencies:
    put:
      operationId: replaceDependencies
      summary: Replace a task's dependencies
      tags:
        - tasks
      description: Requires task:write. Rejects cycles with TASK_CYCLE_DETECTED (409).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceDependenciesRequest'
      responses:
        '200':
          description: Updated task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /tasks/{id}/attachments:
    get:
      operationId: listTaskAttachments
      summary: List a task's attachments (files + URLs)
      tags:
        - tasks
      description: Requires task:read. Returns the task's live (non-archived) attachments.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The task's attachments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListTaskAttachmentsResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: createTaskAttachment
      summary: Attach a file's meta or an external URL to a task
      tags:
        - tasks
      description: >-
        Requires task:write. The file blob lives in file-meta/R2 (client uploads
        it there first); this records only the task↔attachment index + display
        meta. `url` is the file-meta download path (kind=file) or the external
        URL (kind=url).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskAttachmentRequest'
      responses:
        '201':
          description: The created attachment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskAttachment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /tasks/{id}/attachments/{attachmentId}:
    delete:
      operationId: deleteTaskAttachment
      summary: Soft-remove a task attachment
      tags:
        - tasks
      description: Requires task:write.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: attachmentId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Removed
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  schemas:
    TaskAttachment:
      type: object
      required:
        - id
        - taskId
        - kind
        - name
        - url
        - fileId
        - mimeType
        - sizeBytes
        - createdBy
        - createdAt
      properties:
        id:
          type: string
        taskId:
          type: string
        kind:
          type: string
          enum:
            - file
            - url
        name:
          type: string
        url:
          type: string
          description: file-meta download path (kind=file) or the external URL (kind=url).
        fileId:
          type: string
          nullable: true
        mimeType:
          type: string
          nullable: true
        sizeBytes:
          type: integer
          nullable: true
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
    CreateTaskAttachmentRequest:
      type: object
      required:
        - kind
        - name
        - url
      properties:
        kind:
          type: string
          enum:
            - file
            - url
        name:
          type: string
        url:
          type: string
        fileId:
          type: string
        mimeType:
          type: string
        sizeBytes:
          type: integer
    ListTaskAttachmentsResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TaskAttachment'
    Error:
      type: object
      description: Unified error envelope (@dub/errors ErrorResponse). Every non-2xx response uses this shape.
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
            - retryable
          properties:
            code:
              type: string
              description: SCREAMING_SNAKE code. Common set or <SERVICE>_<REASON>.
            message:
              type: string
            details:
              description: Code-specific payload (e.g. FieldError[] for VALIDATION_FAILED, RateLimitDetails for RATE_LIMITED).
            requestId:
              type: string
              description: x-dub-request-id origin.
            service:
              type: string
            retryable:
              type: boolean
    FieldError:
      type: object
      required:
        - field
        - reason
      properties:
        field:
          type: string
          example: title
        reason:
          type: string
          example: required
        message:
          type: string
    RateLimitDetails:
      type: object
      required:
        - retryAfterSec
      properties:
        retryAfterSec:
          type: integer
    TaskStatus:
      type: string
      enum:
        - todo
        - in_progress
        - blocked
        - done
        - cancelled
    TaskPriority:
      type: string
      enum:
        - low
        - medium
        - high
        - urgent
    TaskOrigin:
      type: string
      enum:
        - internal
        - github
    Task:
      type: object
      required:
        - id
        - eventId
        - title
        - status
        - priority
        - origin
        - version
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        eventId:
          type: string
        title:
          type: string
        description:
          type:
            - string
            - 'null'
        status:
          $ref: '#/components/schemas/TaskStatus'
        priority:
          $ref: '#/components/schemas/TaskPriority'
        assigneeId:
          type:
            - string
            - 'null'
        dueAt:
          type:
            - string
            - 'null'
          format: date-time
        origin:
          $ref: '#/components/schemas/TaskOrigin'
        archivedAt:
          type:
            - string
            - 'null'
          format: date-time
        createdAt:
          type: string
          format: date-time
          description: ISO8601 UTC
        updatedAt:
          type: string
          format: date-time
          description: ISO8601 UTC
        version:
          type: integer
    TaskDependency:
      type: object
      required:
        - taskId
        - dependsOnId
      properties:
        taskId:
          type: string
        dependsOnId:
          type: string
    CreateTaskRequest:
      type: object
      description: origin is service-role only (else 400). priority defaults to 'medium'.
      required:
        - eventId
        - title
      properties:
        eventId:
          type: string
        title:
          type: string
        description:
          type: string
        priority:
          $ref: '#/components/schemas/TaskPriority'
        assigneeId:
          type: string
        dueAt:
          type: string
          format: date-time
          description: ISO8601 UTC
        origin:
          $ref: '#/components/schemas/TaskOrigin'
    UpdateTaskRequest:
      type: object
      description: status validated against TASK_STATUS_TRANSITIONS.
      required:
        - version
      properties:
        version:
          type: integer
        title:
          type: string
        description:
          type:
            - string
            - 'null'
        status:
          $ref: '#/components/schemas/TaskStatus'
        priority:
          $ref: '#/components/schemas/TaskPriority'
        assigneeId:
          type:
            - string
            - 'null'
        dueAt:
          type:
            - string
            - 'null'
          format: date-time
    ReplaceDependenciesRequest:
      type: object
      required:
        - version
        - dependsOnIds
      properties:
        version:
          type: integer
        dependsOnIds:
          type: array
          items:
            type: string
    PaginatedTasks:
      type: object
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Task'
        nextCursor:
          type:
            - string
            - 'null'
          description: null = end of results.
  responses:
    BadRequest:
      description: VALIDATION_FAILED — request body/query invalid; error.details is FieldError[].
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthenticated:
      description: UNAUTHENTICATED — missing/invalid session.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: FORBIDDEN — authenticated but lacking the required permission.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: NOT_FOUND — resource does not exist (also returned for internal-only paths hit externally).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: CONFLICT / <SERVICE>_VERSION_CONFLICT — optimistic-lock version mismatch or state conflict.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PreconditionFailed:
      description: PRECONDITION_FAILED.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PayloadTooLarge:
      description: PAYLOAD_TOO_LARGE — body exceeds the route cap.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: RATE_LIMITED — error.details is RateLimitDetails; Retry-After header set.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Internal:
      description: INTERNAL — unhandled server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from a previous response's nextCursor.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      description: Page size. Default 50, max 200.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: dub_session
      description: Web session cookie minted by auth-service; verified at the gateway.
    gatewayIdentity:
      type: apiKey
      in: header
      name: x-dub-user-id
      description: Trusted authn header injected by the gateway after session verification (mode:trustedHeader). Internal boundary only — never accepted from the public internet.
