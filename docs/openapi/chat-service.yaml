# OpenAPI 3.1 contract for chat-service. Generated from services/chat-service/src route tables
# and packages/types/src contract namespaces. Envelope: raw JSON on success,
# @dub/errors ErrorResponse on failure. Cursor pagination (opaque cursor + nextCursor).
openapi: 3.1.0
info:
  title: Chat Service API
  version: 1.0.0
  description: |-
    Channel/message CRUD (STUB pending 9-C) plus WebSocket ticketing for the ChatRoom Durable Object. HTTP is via /api/v1/chat; realtime is DO-direct (gateway rejects WS upgrades).
    
    All responses echo the correlation id in the x-dub-request-id header.
servers:
  - url: https://gateway.example/api/v1
    description: Public base via api-gateway (external clients call /api/v1/chat/...). Paths below are service-internal (post-prefix-strip); the gateway strips /api/v1 before forwarding.
tags:
  - name: chat
  - name: health
security:
  - sessionCookie: []
  - gatewayIdentity: []
paths:
  /health:
    get:
      operationId: chatHealth
      summary: Liveness probe
      tags:
        - health
      responses:
        '200':
          description: OK
      security: []
  /internal/system-messages:
    post:
      operationId: postSystemMessage
      summary: Post a system message
      tags:
        - chat
      description: 'Internal-only: requires x-dub-internal (service binding). The api-gateway 404s this path for external clients.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemMessageRequest'
      responses:
        '201':
          description: Posted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMessage'
        '400':
          $ref: '#/components/responses/BadRequest'
      security: []
  /chat/channels:
    get:
      operationId: listChannels
      summary: List channels the caller can see
      tags:
        - chat
      responses:
        '200':
          description: Channels
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      operationId: createChannel
      summary: Create a channel
      tags:
        - chat
      description: Requires chat:create.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChannelRequest'
      responses:
        '201':
          description: Created channel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatChannel'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /chat/channels/{id}:
    get:
      operationId: getChannel
      summary: Get a channel
      tags:
        - chat
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Channel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatChannel'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateChannel
      summary: Update a channel
      tags:
        - chat
      description: Requires chat:moderate.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateChannelRequest'
      responses:
        '200':
          description: Updated channel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatChannel'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /chat/channels/{id}/members:
    get:
      operationId: listMembers
      summary: List channel members
      description: Roster for the members popover (presence / admin badge). Readable scope — any member, or any caller for a public channel; a private channel is hidden (404) from non-members.
      tags:
        - chat
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Member roster
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChannelMember'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: addMember
      summary: Add a member
      tags:
        - chat
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddMemberRequest'
      responses:
        '204':
          description: Added.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /chat/channels/{id}/members/{userId}:
    delete:
      operationId: removeMember
      summary: Remove a member
      tags:
        - chat
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Removed.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /chat/channels/{id}/pins:
    get:
      operationId: listPins
      summary: List pinned messages
      description: Pinned messages for the channel (Slack-parity), newest-pinned message first, tombstones excluded. Readable scope.
      tags:
        - chat
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Pinned messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChatMessage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: togglePin
      summary: Pin or unpin a message
      description: Toggles the pin for the given message (any channel member may pin/unpin). Returns the updated pinned-message list so the client reconciles in one round-trip.
      tags:
        - chat
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PinRequest'
      responses:
        '200':
          description: Updated pinned-message list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChatMessage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /chat/channels/{id}/read:
    post:
      operationId: updateReadState
      summary: Update the caller's read state
      tags:
        - chat
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReadStateRequest'
      responses:
        '200':
          description: Read state
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
  /chat/channels/{id}/ws-ticket:
    get:
      operationId: issueWsTicket
      summary: Issue a WebSocket ticket for the ChatRoom DO
      tags:
        - chat
      description: WebSocket upgrades are rejected by the gateway; clients connect to doUrl directly with this ticket.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: WS ticket
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WsTicketResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /chat/messages:
    get:
      operationId: listMessages
      summary: List messages in a channel
      tags:
        - chat
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: channelId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Page of messages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessagePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: postMessage
      summary: Post a message
      tags:
        - chat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostMessageRequest'
      responses:
        '201':
          description: Posted message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMessage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /chat/messages/{id}:
    patch:
      operationId: editMessage
      summary: Edit a message
      tags:
        - chat
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Edited message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMessage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteMessage
      summary: Delete a message
      tags:
        - chat
      description: Deleting others' messages requires chat:moderate.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /chat/messages/{id}/reactions:
    post:
      operationId: toggleReaction
      summary: Toggle a reaction
      tags:
        - chat
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReactionRequest'
      responses:
        '200':
          description: Updated message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMessage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
  /chat/search:
    get:
      operationId: searchMessages
      summary: Search messages
      description: Substring match over messages in channels the caller can read (public, or channels the caller belongs to). Tombstones excluded; newest-first; bounded by limit. An empty query returns an empty list.
      tags:
        - chat
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
          description: Search text (case-insensitive substring). Empty/whitespace -> [].
        - name: channelId
          in: query
          required: false
          schema:
            type: string
          description: Scope to a single channel; omit for workspace-wide.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: Search hits (newest-first)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SearchHit'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /chat/unread:
    get:
      operationId: chatUnread
      summary: Caller-scoped unread total
      tags:
        - chat
      responses:
        '200':
          description: Unread
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnreadResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
components:
  schemas:
    Error:
      type: object
      description: Unified error envelope (@dub/errors ErrorResponse). Every non-2xx response uses this shape.
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
            - retryable
          properties:
            code:
              type: string
              description: SCREAMING_SNAKE code. Common set or <SERVICE>_<REASON>.
            message:
              type: string
            details:
              description: Code-specific payload (e.g. FieldError[] for VALIDATION_FAILED, RateLimitDetails for RATE_LIMITED).
            requestId:
              type: string
              description: x-dub-request-id origin.
            service:
              type: string
            retryable:
              type: boolean
    FieldError:
      type: object
      required:
        - field
        - reason
      properties:
        field:
          type: string
          example: title
        reason:
          type: string
          example: required
        message:
          type: string
    RateLimitDetails:
      type: object
      required:
        - retryAfterSec
      properties:
        retryAfterSec:
          type: integer
    ChatChannel:
      type: object
      required:
        - id
        - name
        - createdAt
      properties:
        id:
          type: string
        name:
          type: string
        createdAt:
          type: string
          format: date-time
          description: ISO8601 UTC
    ChatMessage:
      type: object
      required:
        - id
        - channelId
        - authorId
        - body
        - createdAt
      properties:
        id:
          type: string
        channelId:
          type: string
        authorId:
          type: string
        body:
          type: string
        createdAt:
          type: string
          format: date-time
          description: ISO8601 UTC
    WsTicketResponse:
      type: object
      description: Short-lived ticket + absolute DO URL. The WebSocket connects directly to the ChatRoom Durable Object (gateway is bypassed).
      required:
        - ticket
        - doUrl
        - expiresAt
      properties:
        ticket:
          type: string
        doUrl:
          type: string
        expiresAt:
          type: string
          format: date-time
          description: ISO8601 UTC
    CreateChannelRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
    UpdateChannelRequest:
      type: object
      properties:
        name:
          type: string
    AddMemberRequest:
      type: object
      required:
        - userId
      properties:
        userId:
          type: string
    ChannelMember:
      type: object
      required:
        - channelId
        - userId
        - role
        - joinedAt
      properties:
        channelId:
          type: string
        userId:
          type: string
        role:
          type: string
          enum: [admin, member]
        joinedAt:
          type: string
          format: date-time
    PinRequest:
      type: object
      required:
        - messageId
      properties:
        messageId:
          type: string
    SearchHit:
      type: object
      required:
        - message
        - channelId
        - channelName
        - channelType
      properties:
        message:
          $ref: '#/components/schemas/ChatMessage'
        channelId:
          type: string
        channelName:
          type: string
        channelType:
          type: string
          enum: [event, topic, dm]
    PostMessageRequest:
      type: object
      required:
        - body
      properties:
        channelId:
          type: string
        body:
          type: string
    EditMessageRequest:
      type: object
      required:
        - body
      properties:
        body:
          type: string
    ReactionRequest:
      type: object
      required:
        - emoji
      properties:
        emoji:
          type: string
    ReadStateRequest:
      type: object
      required:
        - lastReadMessageId
      properties:
        lastReadMessageId:
          type: string
    ChannelList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ChatChannel'
    MessagePage:
      type: object
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessage'
        nextCursor:
          type:
            - string
            - 'null'
          description: null = end of results.
    UnreadResponse:
      type: object
      description: Caller-scoped unread total.
      properties:
        total:
          type: integer
    SystemMessageRequest:
      type: object
      required:
        - channelId
        - body
      properties:
        channelId:
          type: string
        body:
          type: string
  responses:
    BadRequest:
      description: VALIDATION_FAILED — request body/query invalid; error.details is FieldError[].
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthenticated:
      description: UNAUTHENTICATED — missing/invalid session.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: FORBIDDEN — authenticated but lacking the required permission.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: NOT_FOUND — resource does not exist (also returned for internal-only paths hit externally).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: CONFLICT / <SERVICE>_VERSION_CONFLICT — optimistic-lock version mismatch or state conflict.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PreconditionFailed:
      description: PRECONDITION_FAILED.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PayloadTooLarge:
      description: PAYLOAD_TOO_LARGE — body exceeds the route cap.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: RATE_LIMITED — error.details is RateLimitDetails; Retry-After header set.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Internal:
      description: INTERNAL — unhandled server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from a previous response's nextCursor.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      description: Page size. Default 50, max 200.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: dub_session
      description: Web session cookie minted by auth-service; verified at the gateway.
    gatewayIdentity:
      type: apiKey
      in: header
      name: x-dub-user-id
      description: Trusted authn header injected by the gateway after session verification (mode:trustedHeader). Internal boundary only — never accepted from the public internet.
