# OpenAPI 3.1 contract for file-meta. Generated from services/file-meta/src route tables
# and packages/types/src contract namespaces. Envelope: raw JSON on success,
# @dub/errors ErrorResponse on failure. Cursor pagination (opaque cursor + nextCursor).
openapi: 3.1.0
info:
  title: File Metadata API
  version: 1.0.0
  description: |-
    File metadata registry, links registry, and R2 upload/download. External segment /api/v1/files.
    
    All responses echo the correlation id in the x-dub-request-id header.
servers:
  - url: https://gateway.example/api/v1
    description: Public base via api-gateway (external clients call /api/v1/files/...). Paths below are service-internal (post-prefix-strip); the gateway strips /api/v1 before forwarding.
tags:
  - name: files
  - name: health
security:
  - sessionCookie: []
  - gatewayIdentity: []
paths:
  /internal/health:
    get:
      operationId: fileHealth
      summary: Liveness probe
      tags:
        - health
      description: 'Internal-only: requires x-dub-internal (service binding). The api-gateway 404s this path for external clients.'
      responses:
        '200':
          description: OK
      security: []
  /files/meta:
    post:
      operationId: registerMeta
      summary: Register file metadata
      tags:
        - files
      description: Requires file:write. FILE_DUPLICATE_EXTERNAL (409) if the drive file is already registered.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterMetaRequest'
      responses:
        '201':
          description: Registered metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /files/search:
    get:
      operationId: searchFiles
      summary: Search file metadata
      tags:
        - files
      description: Requires file:read. Private files are filtered to the caller.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: q
          in: query
          schema:
            type: string
        - name: mimeType
          in: query
          schema:
            type: string
        - name: ownerId
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Page of files
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedFiles'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /files/meta/{id}:
    get:
      operationId: getMeta
      summary: Get file metadata
      tags:
        - files
      description: Requires file:read.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: include
          in: query
          description: Comma-separated, e.g. 'links'.
          schema:
            type: string
      responses:
        '200':
          description: File (with links if requested)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileWithLinks'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateMeta
      summary: Update file metadata
      tags:
        - files
      description: Requires file:write; owner change requires file:admin.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMetaRequest'
      responses:
        '200':
          description: Updated file
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      operationId: deleteMeta
      summary: Soft-delete a file
      tags:
        - files
      description: Requires file:write.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /files/meta/{id}/links:
    post:
      operationId: createLink
      summary: Link a file to a resource
      tags:
        - files
      description: Requires file:write.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLinkRequest'
      responses:
        '201':
          description: Created link
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileMetaLink'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      operationId: deleteLink
      summary: Remove a file link
      tags:
        - files
      description: Requires file:write.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: targetType
          in: query
          required: true
          schema:
            type: string
        - name: targetId
          in: query
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Removed.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /files:
    post:
      operationId: uploadFile
      summary: Upload a file (multipart) to R2 + register
      tags:
        - files
      description: Requires file:write. Body cap is the gateway FILES route cap (25MB).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                name:
                  type: string
                visibility:
                  $ref: '#/components/schemas/FileVisibility'
      responses:
        '201':
          description: Registered file
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
  /files/{id}/download:
    get:
      operationId: downloadFile
      summary: Download a file body from R2
      tags:
        - files
      description: Requires file:read. Drive-backed files return 409 (served via drive-proxy embed).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Raw file body.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
components:
  schemas:
    Error:
      type: object
      description: Unified error envelope (@dub/errors ErrorResponse). Every non-2xx response uses this shape.
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
            - retryable
          properties:
            code:
              type: string
              description: SCREAMING_SNAKE code. Common set or <SERVICE>_<REASON>.
            message:
              type: string
            details:
              description: Code-specific payload (e.g. FieldError[] for VALIDATION_FAILED, RateLimitDetails for RATE_LIMITED).
            requestId:
              type: string
              description: x-dub-request-id origin.
            service:
              type: string
            retryable:
              type: boolean
    FieldError:
      type: object
      required:
        - field
        - reason
      properties:
        field:
          type: string
          example: title
        reason:
          type: string
          example: required
        message:
          type: string
    RateLimitDetails:
      type: object
      required:
        - retryAfterSec
      properties:
        retryAfterSec:
          type: integer
    FileVisibility:
      type: string
      enum:
        - org
        - private
    FileMeta:
      type: object
      required:
        - id
        - name
        - mimeType
        - sizeBytes
        - ownerId
        - visibility
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        name:
          type: string
        mimeType:
          type: string
        sizeBytes:
          type: integer
        ownerId:
          type: string
        visibility:
          $ref: '#/components/schemas/FileVisibility'
        driveFileId:
          type:
            - string
            - 'null'
        r2Key:
          type:
            - string
            - 'null'
        createdAt:
          type: string
          format: date-time
          description: ISO8601 UTC
        updatedAt:
          type: string
          format: date-time
          description: ISO8601 UTC
    FileMetaLink:
      type: object
      required:
        - fileId
        - targetType
        - targetId
        - linkedAt
      properties:
        fileId:
          type: string
        targetType:
          type: string
          enum:
            - task
            - event
            - action
            - message
        targetId:
          type: string
        linkedAt:
          type: string
          format: date-time
          description: ISO8601 UTC
    RegisterMetaRequest:
      type: object
      required:
        - name
        - mimeType
        - sizeBytes
      properties:
        name:
          type: string
        mimeType:
          type: string
        sizeBytes:
          type: integer
        visibility:
          $ref: '#/components/schemas/FileVisibility'
        driveFileId:
          type: string
        r2Key:
          type: string
    UpdateMetaRequest:
      type: object
      description: ownerId change requires file:admin.
      properties:
        name:
          type: string
        visibility:
          $ref: '#/components/schemas/FileVisibility'
        ownerId:
          type: string
    FileWithLinks:
      type: object
      description: links present only when ?include=links.
      required:
        - file
      properties:
        file:
          $ref: '#/components/schemas/FileMeta'
        links:
          type: array
          items:
            $ref: '#/components/schemas/FileMetaLink'
    CreateLinkRequest:
      type: object
      required:
        - targetType
        - targetId
      properties:
        targetType:
          type: string
          enum:
            - task
            - event
            - action
            - message
        targetId:
          type: string
    PaginatedFiles:
      type: object
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FileMeta'
        nextCursor:
          type:
            - string
            - 'null'
          description: null = end of results.
  responses:
    BadRequest:
      description: VALIDATION_FAILED — request body/query invalid; error.details is FieldError[].
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthenticated:
      description: UNAUTHENTICATED — missing/invalid session.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: FORBIDDEN — authenticated but lacking the required permission.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: NOT_FOUND — resource does not exist (also returned for internal-only paths hit externally).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: CONFLICT / <SERVICE>_VERSION_CONFLICT — optimistic-lock version mismatch or state conflict.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PreconditionFailed:
      description: PRECONDITION_FAILED.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PayloadTooLarge:
      description: PAYLOAD_TOO_LARGE — body exceeds the route cap.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: RATE_LIMITED — error.details is RateLimitDetails; Retry-After header set.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Internal:
      description: INTERNAL — unhandled server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from a previous response's nextCursor.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      description: Page size. Default 50, max 200.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: dub_session
      description: Web session cookie minted by auth-service; verified at the gateway.
    gatewayIdentity:
      type: apiKey
      in: header
      name: x-dub-user-id
      description: Trusted authn header injected by the gateway after session verification (mode:trustedHeader). Internal boundary only — never accepted from the public internet.
