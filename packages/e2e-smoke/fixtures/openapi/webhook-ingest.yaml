# OpenAPI 3.1 contract for webhook-ingest. Generated from services/webhook-ingest/src route tables
# and packages/types/src contract namespaces. Envelope: raw JSON on success,
# @dub/errors ErrorResponse on failure. Cursor pagination (opaque cursor + nextCursor).
openapi: 3.1.0
info:
  title: Webhook Ingest API
  version: 1.0.0
  description: |-
    Two faces: a provider-facing signature-verified ingress at /hooks/{source} (direct, not proxied), and administrative delivery reads exposed via the gateway at /api/v1/webhooks. Persists a single WebhookEventEnvelopeV1 (payloads >96KB spill to R2) and re-publishes onto the Queue.
    
    All responses echo the correlation id in the x-dub-request-id header.
servers:
  - url: https://webhook-ingest.example
    description: Provider ingress base (/hooks/*) is public and signature-verified. The /api/v1/webhooks/* admin reads are reached through the api-gateway.
tags:
  - name: webhooks
  - name: health
security: []
paths:
  /internal/health:
    get:
      operationId: webhookHealth
      summary: Liveness probe
      tags:
        - health
      description: 'Internal-only: requires x-dub-internal (service binding). The api-gateway 404s this path for external clients.'
      responses:
        '200':
          description: OK
      security: []
  /hooks/{source}:
    post:
      operationId: ingestWebhook
      summary: Receive a provider webhook
      tags:
        - webhooks
      description: Provider-facing ingress (NOT via the api-gateway). Authenticity is by per-source signature verification (e.g. X-Hub-Signature-256 for GitHub). Idempotent on the minted deliveryId.
      parameters:
        - name: source
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/WebhookSource'
      responses:
        '200':
          description: Ingest ack
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookIngestAck'
        '400':
          $ref: '#/components/responses/BadRequest'
      security: []
    get:
      operationId: webhookChallenge
      summary: Provider verification challenge (e.g. Drive watch)
      tags:
        - webhooks
      parameters:
        - name: source
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/WebhookSource'
      responses:
        '200':
          description: Challenge echo / status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
      security: []
  /api/v1/webhooks/deliveries:
    get:
      operationId: listDeliveries
      summary: Search webhook delivery records
      tags:
        - webhooks
      description: Administrative read via the api-gateway (segment /api/v1/webhooks). Requires webhook:read.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: source
          in: query
          schema:
            $ref: '#/components/schemas/WebhookSource'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/WebhookDeliveryStatus'
      responses:
        '200':
          description: Page of deliveries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookDeliveryPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
      security:
        - sessionCookie: []
        - gatewayIdentity: []
  /api/v1/webhooks/deliveries/{id}:
    get:
      operationId: getDelivery
      summary: Get a webhook delivery
      tags:
        - webhooks
      description: Requires webhook:read.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Delivery
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookDelivery'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        - sessionCookie: []
        - gatewayIdentity: []
components:
  schemas:
    Error:
      type: object
      description: Unified error envelope (@dub/errors ErrorResponse). Every non-2xx response uses this shape.
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
            - retryable
          properties:
            code:
              type: string
              description: SCREAMING_SNAKE code. Common set or <SERVICE>_<REASON>.
            message:
              type: string
            details:
              description: Code-specific payload (e.g. FieldError[] for VALIDATION_FAILED, RateLimitDetails for RATE_LIMITED).
            requestId:
              type: string
              description: x-dub-request-id origin.
            service:
              type: string
            retryable:
              type: boolean
    FieldError:
      type: object
      required:
        - field
        - reason
      properties:
        field:
          type: string
          example: title
        reason:
          type: string
          example: required
        message:
          type: string
    RateLimitDetails:
      type: object
      required:
        - retryAfterSec
      properties:
        retryAfterSec:
          type: integer
    WebhookSource:
      type: string
      enum:
        - github
        - google-drive
        - gmail
        - stripe
    WebhookIngestAck:
      type: object
      description: deliveryId (ULID) is the idempotency key.
      required:
        - deliveryId
        - accepted
      properties:
        deliveryId:
          type: string
        accepted:
          type: boolean
    WebhookDeliveryStatus:
      type: string
      enum:
        - received
        - processed
        - failed
    WebhookDelivery:
      type: object
      required:
        - id
        - source
        - eventKind
        - status
        - receivedAt
      properties:
        id:
          type: string
        source:
          $ref: '#/components/schemas/WebhookSource'
        eventKind:
          type: string
        status:
          $ref: '#/components/schemas/WebhookDeliveryStatus'
        receivedAt:
          type: string
          format: date-time
          description: ISO8601 UTC
        processedAt:
          type:
            - string
            - 'null'
          format: date-time
    WebhookDeliveryPage:
      type: object
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WebhookDelivery'
        nextCursor:
          type:
            - string
            - 'null'
          description: null = end of results.
  responses:
    BadRequest:
      description: VALIDATION_FAILED — request body/query invalid; error.details is FieldError[].
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthenticated:
      description: UNAUTHENTICATED — missing/invalid session.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: FORBIDDEN — authenticated but lacking the required permission.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: NOT_FOUND — resource does not exist (also returned for internal-only paths hit externally).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: CONFLICT / <SERVICE>_VERSION_CONFLICT — optimistic-lock version mismatch or state conflict.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PreconditionFailed:
      description: PRECONDITION_FAILED.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PayloadTooLarge:
      description: PAYLOAD_TOO_LARGE — body exceeds the route cap.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: RATE_LIMITED — error.details is RateLimitDetails; Retry-After header set.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Internal:
      description: INTERNAL — unhandled server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from a previous response's nextCursor.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      description: Page size. Default 50, max 200.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: dub_session
      description: Web session cookie minted by auth-service; verified at the gateway.
    gatewayIdentity:
      type: apiKey
      in: header
      name: x-dub-user-id
      description: Trusted authn header injected by the gateway after session verification (mode:trustedHeader). Internal boundary only — never accepted from the public internet.
