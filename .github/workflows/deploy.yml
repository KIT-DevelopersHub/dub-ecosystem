name: Deploy (production)

# Auto-deploy the free-tier Worker set to production on every merge to main.
#
# WHY: deploys used to be a human/agent running `wrangler deploy` by hand after
# watching CI. When that watcher was idle, a merged + green change silently never
# reached prod (surfaced once as a 404 on a gateway route). This workflow removes
# that single point of failure: merge to main == deploy, no watcher required.
#
# Green gate: this job re-runs typecheck + test + build itself, so a red commit can
# never deploy — the deploy steps only run after verify passes in the SAME job.
# (Chosen over `workflow_run` on ci.yml: self-contained, no cross-workflow SHA/branch
# resolution quirks, and the green result is guaranteed for the exact deployed tree.)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_healthcheck:
        description: "Skip post-deploy health/smoke checks"
        type: boolean
        default: false

# Serialize production deploys. Never cancel a mid-flight deploy — queue the next one
# (concurrent deploys to the same account are a known outage source).
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  # read-only: resolve the merged PR (title/number/url) behind the deploy for the
  # post-deploy Admin notification. No write scopes.
  pull-requests: read

env:
  TURBO_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1

jobs:
  deploy:
    name: verify · deploy · smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # First run auto-creates this environment (no protection). Add required reviewers
    # under Settings → Environments → production to gate deploys behind approval.
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # fe2 is a static SPA — the API base is baked in at BUILD time. Override via a
      # repo variable if the prod gateway origin differs from the workers.dev default.
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://dub-api-gateway.developershub-site.workers.dev' }}
      # Public origins used by the post-deploy smoke checks.
      GATEWAY_HEALTH_URL: ${{ vars.GATEWAY_HEALTH_URL || 'https://dub-api-gateway.developershub-site.workers.dev' }}
      MOBILE_BFF_HEALTH_URL: ${{ vars.MOBILE_BFF_HEALTH_URL }}
      # Optional: when set, deploy-prod.sh arms the app-health-monitor hourly alarm after deploy
      # (POST /internal/monitor/kick, gated by this shared token). Unset => armed manually once.
      MONITOR_ADMIN_TOKEN: ${{ secrets.MONITOR_ADMIN_TOKEN }}
      MONITOR_HEALTH_URL: ${{ vars.MONITOR_HEALTH_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preflight — required secret present
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret is not set. Add it under Settings → Secrets and variables → Actions. See docs/DEPLOY.md."
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      # --- Green gate: identical checks to ci.yml, in-job, before any deploy ---
      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      # Builds all packages; fe2's Vite bundle bakes in VITE_API_BASE_URL (prod gateway).
      - name: Build
        run: pnpm run build

      # --- Migrations (guarded) ---
      # D1 dub-core migrations are forward-only + idempotent (ledger + CREATE ... IF NOT
      # EXISTS). Remote apply is NOT wired into this repo yet (the custom migrate.ts is
      # local-only; the namespaced layout is applied via the infra pipeline out-of-band).
      # This step is the ordered insertion point: enable it by setting the repo variable
      # DEPLOY_APPLY_MIGRATIONS=true once a remote apply command exists. Until then it is
      # a no-op so the workflow can never half-apply schema. See docs/DEPLOY.md §Migrations.
      - name: Apply D1 migrations (guarded)
        run: |
          if [ "${{ vars.DEPLOY_APPLY_MIGRATIONS }}" = "true" ]; then
            echo "::error::DEPLOY_APPLY_MIGRATIONS=true but no remote apply command is wired. Wire it here (see docs/DEPLOY.md) before enabling."
            exit 1
          fi
          echo "D1 migrations: skipped (applied out-of-band). dub-core schema is forward-only + idempotent."

      # --- Deploy in dependency order with fail-fast health gating ---
      - name: Deploy to production
        run: bash infra/deploy/deploy-prod.sh
        env:
          SKIP_HEALTHCHECK: ${{ inputs.skip_healthcheck && '1' || '0' }}

      # --- Auto Admin notification (every successful prod deploy) ---
      # Records ONE idempotent audience='admin' notification in dub-core D1 describing the
      # deployed change (merged PR title/number/url + SHA + services + time). Admins see it
      # in their inbox (notification-service materializes audience='admin' rows lazily on
      # read); members do NOT. dedupKey=deploy:<sha> → re-deploys never double-notify.
      #
      # GUARDED OFF by default: set the repo VARIABLE DEPLOY_ADMIN_NOTIFY=true to enable
      # (mirrors the DEPLOY_APPLY_MIGRATIONS pattern) so it can be reviewed before it starts
      # writing to prod. best-effort (continue-on-error) — a notify hiccup never fails a
      # successful deploy.
      - name: Notify admins of deploy
        if: ${{ vars.DEPLOY_ADMIN_NOTIFY == 'true' }}
        continue-on-error: true
        working-directory: infra/d1
        # CLOUDFLARE_API_TOKEN is inherited from the job env (used by --apply → wrangler).
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA="${GITHUB_SHA}"
          # Best-effort: resolve the merged PR behind this commit (title/number/url).
          PR_JSON="$(gh pr list --repo "${GITHUB_REPOSITORY}" --search "${SHA}" --state merged --json number,title,url --jq '.[0]' 2>/dev/null || echo '')"
          if [ -n "${PR_JSON}" ] && [ "${PR_JSON}" != "null" ]; then
            TITLE="$(printf '%s' "${PR_JSON}" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).title||"")}catch{console.log("")}})')"
            PRNUM="$(printf '%s' "${PR_JSON}" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).number||"")}catch{console.log("")}})')"
            URL="$(printf '%s' "${PR_JSON}" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).url||"")}catch{console.log("")}})')"
          else
            # Fallback: first line of the deployed commit subject.
            TITLE="$(git log -1 --pretty=%s "${SHA}" 2>/dev/null || echo 'production deploy')"
            PRNUM=""; URL=""
          fi
          node --import tsx scripts/admin-notify.ts --apply \
            --sha "${SHA}" \
            --title "${TITLE}" \
            ${PRNUM:+--pr "${PRNUM}"} \
            ${URL:+--url "${URL}"} \
            --services "全Worker + fe2 + mo3 (deploy-prod.sh)" \
            --ref "${GITHUB_REF}"

