name: Deploy (production)

# Auto-deploy the free-tier Worker set to production on every merge to main.
#
# WHY: deploys used to be a human/agent running `wrangler deploy` by hand after
# watching CI. When that watcher was idle, a merged + green change silently never
# reached prod (surfaced once as a 404 on a gateway route). This workflow removes
# that single point of failure: merge to main == deploy, no watcher required.
#
# Green gate: this job re-runs typecheck + test + build itself, so a red commit can
# never deploy — the deploy steps only run after verify passes in the SAME job.
# (Chosen over `workflow_run` on ci.yml: self-contained, no cross-workflow SHA/branch
# resolution quirks, and the green result is guaranteed for the exact deployed tree.)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_healthcheck:
        description: "Skip post-deploy health/smoke checks"
        type: boolean
        default: false

# Serialize production deploys. Never cancel a mid-flight deploy — queue the next one
# (concurrent deploys to the same account are a known outage source).
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  # write: the post-deploy step commits deploy-state/prod.json back to main so there is a
  # machine-readable record of WHAT IS ACTUALLY ON PRODUCTION. Until 2026-09-29 that file was
  # still the seed (`deployedSha: null`) and nothing ever wrote it, so "prod is stale" was
  # undetectable — production served the OLD role UI for days with no signal anywhere.
  # The push is best-effort (main is protected); a rejected push warns, never fails.
  contents: write
  # read-only: resolve the merged PR (title/number/url/body) behind the deploy for the
  # post-deploy Admin notification and the Liveness-Marker trailer.
  pull-requests: read

env:
  TURBO_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1

jobs:
  deploy:
    name: verify · deploy · smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # First run auto-creates this environment (no protection). Add required reviewers
    # under Settings → Environments → production to gate deploys behind approval.
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # fe2 is a static SPA — the API base is baked in at BUILD time. Override via a
      # repo variable if the prod gateway origin differs from the workers.dev default.
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://dub-api-gateway.developershub-site.workers.dev' }}
      # Public origins used by the post-deploy smoke checks.
      GATEWAY_HEALTH_URL: ${{ vars.GATEWAY_HEALTH_URL || 'https://dub-api-gateway.developershub-site.workers.dev' }}
      MOBILE_BFF_HEALTH_URL: ${{ vars.MOBILE_BFF_HEALTH_URL }}
      # Optional: when set, deploy-prod.sh arms the app-health-monitor hourly alarm after deploy
      # (POST /internal/monitor/kick, gated by this shared token). Unset => armed manually once.
      MONITOR_ADMIN_TOKEN: ${{ secrets.MONITOR_ADMIN_TOKEN }}
      MONITOR_HEALTH_URL: ${{ vars.MONITOR_HEALTH_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --- Gate #2 (fail-close): production label gate ---------------------------------
      # Defence in depth for prod-gate.yml (which enforces the `確認した` label at MERGE
      # time via branch protection). This re-verifies, at DEPLOY time, that the merged PR
      # behind this commit actually carried `確認した` — catching direct pushes, admin
      # merge-without-check bypasses, and label races. If the label is absent the deploy
      # ABORTS (exit 1) before deploy-prod.sh runs.
      #
      # STANDBY BY DEFAULT: gated on the repo variable PROD_LABEL_GATE (mirrors the
      # DEPLOY_APPLY_MIGRATIONS / DEPLOY_ADMIN_NOTIFY pattern). While unset/false this is a
      # no-op, so in-flight prod-direct work keeps deploying under the old rules. At CUTOVER
      # the owner sets PROD_LABEL_GATE=true. `workflow_dispatch` (manual owner deploy) is
      # intentionally exempt — the manual run IS the confirmation. See
      # docs/runbooks/04-staging-label-gate.md.
      - name: Enforce 「確認した」 label (fail-close)
        if: ${{ vars.PROD_LABEL_GATE == 'true' && github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          # Resolve the merged PR behind this commit (same mechanism as the admin-notify step).
          PR_NUM="$(gh pr list --repo "${REPO}" --search "${SHA}" --state merged \
            --json number --jq '.[0].number' 2>/dev/null || echo '')"
          if [ -z "${PR_NUM}" ] || [ "${PR_NUM}" = "null" ]; then
            echo "::error title=本番ゲート::この commit (${SHA}) に対応する merged PR が見つかりません。ラベルゲートを機械判定できないため fail-close します。「確認した」ラベル付きの PR 経由でマージするか、workflow_dispatch で手動デプロイしてください。"
            exit 1
          fi
          HAS_LABEL="$(gh pr view "${PR_NUM}" --repo "${REPO}" \
            --json labels --jq '[.labels[].name] | index("確認した") != null')"
          if [ "${HAS_LABEL}" != "true" ]; then
            echo "::error title=本番ゲート::PR #${PR_NUM} に「確認した」ラベルがありません。staging 確認 → 「確認した」付与の手順を踏んでから本番へ。deploy を abort します。"
            exit 1
          fi
          echo "✅ PR #${PR_NUM} は「確認した」済み — 本番デプロイを続行します。"

      - name: Preflight — required secret present
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret is not set. Add it under Settings → Secrets and variables → Actions. See docs/DEPLOY.md."
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      # --- Green gate: identical checks to ci.yml, in-job, before any deploy ---
      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      # Builds all packages; fe2's Vite bundle bakes in VITE_API_BASE_URL (prod gateway).
      - name: Build
        run: pnpm run build

      # --- Migrations (guarded) ---
      # D1 dub-core migrations are forward-only + idempotent (ledger + CREATE ... IF NOT
      # EXISTS). Remote apply is NOT wired into this repo yet (the custom migrate.ts is
      # local-only; the namespaced layout is applied via the infra pipeline out-of-band).
      # This step is the ordered insertion point: enable it by setting the repo variable
      # DEPLOY_APPLY_MIGRATIONS=true once a remote apply command exists. Until then it is
      # a no-op so the workflow can never half-apply schema. See docs/DEPLOY.md §Migrations.
      - name: Apply D1 migrations (guarded)
        run: |
          if [ "${{ vars.DEPLOY_APPLY_MIGRATIONS }}" = "true" ]; then
            echo "::error::DEPLOY_APPLY_MIGRATIONS=true but no remote apply command is wired. Wire it here (see docs/DEPLOY.md) before enabling."
            exit 1
          fi
          echo "D1 migrations: skipped (applied out-of-band). dub-core schema is forward-only + idempotent."

      # --- Deploy in dependency order with fail-fast health gating ---
      - name: Deploy to production
        run: bash infra/deploy/deploy-prod.sh
        env:
          SKIP_HEALTHCHECK: ${{ inputs.skip_healthcheck && '1' || '0' }}

      # --- PROD LIVENESS + LIVE-STATE RECORD -------------------------------------------
      # WHY (2026-09-29): staging has asserted its served bundle against the PR's
      # `Liveness-Marker:` trailer since #423, but PRODUCTION never did. Combined with
      # `deploy-state/prod.json` still being the seed (`deployedSha: null`, written by nobody),
      # there was NO way — by machine or by eye — to tell what production actually served.
      # The result: PR #562 was evicted from staging by an unrelated merge, never got merged,
      # and prod quietly kept serving the OLD role UI (#270/#526) with everything "green".
      #
      # This step closes both halves: assert the markers against the PROD bundle, and write
      # down what is live. The marker trailer is parsed by scripts/lib/promote-lib.sh — the
      # SAME function staging.yml and scripts/promote-prod.sh use, so the three cannot drift.
      #
      # Does NOT fail here (see "Enforce production liveness" below): the record must be
      # written even when the verification fails — a FAILED verification is exactly the state
      # worth recording.
      # Runs only when the deploy above succeeded (default step condition) — there is nothing
      # to verify or record after a failed deploy.
      - name: Verify production liveness + record live state
        id: prodstate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          . scripts/lib/promote-lib.sh

          # Same mechanism the label gate and the admin-notify step already use.
          PR_NUM="$(gh pr list --repo "${REPO}" --search "${SHA}" --state merged \
            --json number --jq '.[0].number' 2>/dev/null || echo '')"
          [ "${PR_NUM}" = "null" ] && PR_NUM=""
          PR_BODY=""
          if [ -n "${PR_NUM}" ]; then
            PR_BODY="$(gh pr view "${PR_NUM}" --repo "${REPO}" --json body --jq '.body' 2>/dev/null || echo '')"
          fi

          MK=(); COUNT=0
          while IFS= read -r m; do
            [ -n "$m" ] || continue
            MK+=("$m"); COUNT=$((COUNT + 1))
          done < <(printf '%s\n' "${PR_BODY}" | parse_liveness_markers)

          STATUS="skipped"; LIVE="false"
          if [ "${COUNT}" -eq 0 ]; then
            # Back-compatible, identical to staging: no trailer => warn and continue. docs /
            # chore / deps PRs legitimately have nothing to assert.
            echo "::warning::no Liveness-Marker trailer on the merged PR (${PR_NUM:-unknown}); production bundle not asserted."
          else
            if bash scripts/verify-live.sh prod "${MK[@]}"; then
              STATUS="live"; LIVE="true"
            else
              STATUS="not-live"
            fi
          fi

          MARKERS_CSV="$(IFS=,; printf '%s' "${MK[*]-}")"
          echo "status=${STATUS}"             >> "$GITHUB_OUTPUT"
          echo "markers=${MARKERS_CSV}"       >> "$GITHUB_OUTPUT"
          echo "pr=${PR_NUM}"                 >> "$GITHUB_OUTPUT"

          SHA="${SHA}" PR_NUM="${PR_NUM}" MARKERS_CSV="${MARKERS_CSV}" LIVE="${LIVE}" \
          STATUS="${STATUS}" ACTOR="${GITHUB_ACTOR:-}" node -e '
            const fs = require("fs");
            const p = "deploy-state/prod.json";
            let cur = {};
            try { cur = JSON.parse(fs.readFileSync(p, "utf8")); } catch { cur = {}; }
            const now = new Date().toISOString();
            const markers = (process.env.MARKERS_CSV || "").split(",").map(s => s.trim()).filter(Boolean);
            const out = {
              env: "prod",
              url: cur.url || "https://dub-fe2-app-shell.developershub-site.workers.dev",
              deployedSha: process.env.SHA,
              branch: "main",
              actor: process.env.ACTOR || "",
              pr: process.env.PR_NUM ? Number(process.env.PR_NUM) : null,
              markers,
              live: process.env.LIVE === "true",
              verifiedAt: markers.length ? now : null,
              updatedAt: now,
              note: markers.length
                ? `deploy.yml: verify-live prod -> ${process.env.STATUS}`
                : "deploy.yml: deployed; no Liveness-Marker trailer on the merged PR, so the served bundle was not asserted.",
            };
            fs.writeFileSync(p, JSON.stringify(out, null, 2) + "\n");
            console.log("deploy-state/prod.json:", JSON.stringify(out));
          '

      # Commit the live-state record back to main. main is a protected branch (PR +
      # `確認した` required), so a direct push from CI is rejected with GH006 — this is
      # bookkeeping, the deploy already happened, and a rejected push must WARN, never fail.
      # Same tolerance as .github/workflows/refresh-demos.yml.
      - name: Commit deploy-state/prod.json (best effort)
        if: always() && steps.prodstate.conclusion == 'success'
        continue-on-error: true
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- deploy-state/prod.json; then
            echo "no prod live-state change to commit"
            exit 0
          fi
          git add deploy-state/prod.json
          git commit -m "chore(deploy): record production live state [skip ci]"
          if ! git push origin "HEAD:${GITHUB_REF_NAME}"; then
            echo "::warning::could not push deploy-state/prod.json to protected main (GH006). Production is deployed and (if markers were given) verified regardless; the manifest on main is unchanged."
          fi

      # --- Auto Admin notification (every successful prod deploy) ---
      # Records ONE idempotent audience='admin' notification in dub-core D1 describing the
      # deployed change (merged PR title/number/url + SHA + services + time). Admins see it
      # in their inbox (notification-service materializes audience='admin' rows lazily on
      # read); members do NOT. dedupKey=deploy:<sha> → re-deploys never double-notify.
      #
      # GUARDED OFF by default: set the repo VARIABLE DEPLOY_ADMIN_NOTIFY=true to enable
      # (mirrors the DEPLOY_APPLY_MIGRATIONS pattern) so it can be reviewed before it starts
      # writing to prod. best-effort (continue-on-error) — a notify hiccup never fails a
      # successful deploy.
      - name: Notify admins of deploy
        if: ${{ vars.DEPLOY_ADMIN_NOTIFY == 'true' }}
        continue-on-error: true
        working-directory: infra/d1
        # CLOUDFLARE_API_TOKEN is inherited from the job env (used by --apply → wrangler).
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA="${GITHUB_SHA}"
          # Best-effort: resolve the merged PR behind this commit (title/number/url).
          PR_JSON="$(gh pr list --repo "${GITHUB_REPOSITORY}" --search "${SHA}" --state merged --json number,title,url --jq '.[0]' 2>/dev/null || echo '')"
          if [ -n "${PR_JSON}" ] && [ "${PR_JSON}" != "null" ]; then
            TITLE="$(printf '%s' "${PR_JSON}" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).title||"")}catch{console.log("")}})')"
            PRNUM="$(printf '%s' "${PR_JSON}" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).number||"")}catch{console.log("")}})')"
            URL="$(printf '%s' "${PR_JSON}" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).url||"")}catch{console.log("")}})')"
          else
            # Fallback: first line of the deployed commit subject.
            TITLE="$(git log -1 --pretty=%s "${SHA}" 2>/dev/null || echo 'production deploy')"
            PRNUM=""; URL=""
          fi
          node --import tsx scripts/admin-notify.ts --apply \
            --sha "${SHA}" \
            --title "${TITLE}" \
            ${PRNUM:+--pr "${PRNUM}"} \
            ${URL:+--url "${URL}"} \
            --services "全Worker + fe2 + mo3 (deploy-prod.sh)" \
            --ref "${GITHUB_REF}"

      # Fail the job LAST — after the live-state record is written/pushed and the admins are
      # notified — when the merged PR DID carry markers and production does not serve them.
      # A prod deploy that did not actually ship the feature must be a RED run: until now the
      # only place a stale production could have surfaced was a human opening the URL, and on
      # 2026-09-29 nobody did for days. Placed last (same pattern as staging.yml) so failing
      # it never suppresses the bookkeeping steps above.
      - name: Enforce production liveness
        if: always() && steps.prodstate.outputs.status == 'not-live'
        run: |
          echo "::error::production liveness FAILED — the merged PR's Liveness-Marker(s) are NOT in the served production bundle. Production may still be serving an older build. Investigate before announcing the change."
          exit 1

