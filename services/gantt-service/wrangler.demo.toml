# gantt-service — DISPOSABLE presence DEMO Worker config. Deploys ONLY the realtime
# GanttRoom Durable Object + the self-contained 2-tab presence demo page. No D1 / KV /
# Queues / Service Bindings — the demo never touches the read model or the DB, so it costs
# nothing but one Worker script slot (reclaim it with `wrangler delete`). NOT for prod.
#
# Deploy (throwaway name overrides the base name):
#   export CLOUDFLARE_API_TOKEN=$(cat ~/Desktop/cf-token.txt)
#   pnpm dlx wrangler@4.35.0 deploy --config services/gantt-service/wrangler.demo.toml \
#     --name dub-demo-gantt-presence
name = "dub-demo-gantt-presence"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]
# Public workers.dev subdomain ON: the demo page + DO-direct WS must be reachable from the
# browser (the real deployment keeps this off and routes WS via the subdomain separately).
workers_dev = true

# The gantt-owned GanttRoom Durable Object (WS coordinator; holds NO durable rows → $0).
[[durable_objects.bindings]]
name = "GANTT_ROOM"
class_name = "GanttRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GanttRoom"]

[observability]
enabled = true

[vars]
# Enable the self-contained demo page (/) + unauthenticated ws-ticket issuer (/demo/ws-ticket).
GANTT_RT_DEV_TICKET = "1"
# Demo-only signing secret (throwaway). The DO verifies with the same value.
WS_TICKET_SECRET = "demo-insecure-ws-ticket-secret"
# DO-direct WS base = this same demo Worker. ":id" -> eventId.
GANTT_RT_DO_URL_BASE = "wss://dub-demo-gantt-presence.developershub-site.workers.dev/ws/:id"
# Origin allow-list enforced by the DO: the demo page is served from (and opens its WS to)
# this same Worker origin, so allow it.
GANTT_RT_ALLOWED_ORIGINS = "https://dub-demo-gantt-presence.developershub-site.workers.dev"
