# gantt-service — Cloudflare Worker config (scaffold; NOT deployed by this unit).
# One physical Worker per service (テーマ7). Shared D1 "dub-core", binding = DB (テーマ12).
name = "dub-gantt-service"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

# Shared core D1 (single DB; gantt owns the gantt_* namespace only).
[[d1_databases]]
binding = "DB"
database_name = "dub-core"
database_id = "d663f9c6-499f-4c67-910d-e08733d5278d" # placeholder; infra sets the real id
migrations_dir = "migrations"

# DTO short-lived cache (テーマ: gantt:dto:<eventId>, TTL 60s).
[[kv_namespaces]]
binding = "GANTT_KV"
id = "fc2d133f9b9f458ab5746f7b40b4bcde" # placeholder; infra sets the real id

# Inbound event queue (cache purge). DLQ + max_retries per Queue catalog common values.
# [[queues.consumers]]
# queue = "dub-q-evt-gantt"
# max_batch_size = 10
# max_batch_timeout = 5
# max_retries = 5
# dead_letter_queue = "dub-q-evt-gantt-dlq"

# Upstream services via Service Bindings (read-only: task/event; authz: identity).
[[services]]
binding = "SVC_TASK"
service = "dub-task-service"

[[services]]
binding = "SVC_EVENT"
service = "dub-event-service"

[[services]]
binding = "SVC_IDENTITY"
service = "dub-identity-roster"

[observability]
enabled = true
