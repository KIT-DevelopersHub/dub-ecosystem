# gantt-service — Cloudflare Worker config (scaffold; NOT deployed by this unit).
# One physical Worker per service (テーマ7). Shared D1 "dub-core", binding = DB (テーマ12).
name = "gantt-service"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

# Shared core D1 (single DB; gantt owns the gantt_* namespace only).
[[d1_databases]]
binding = "DB"
database_name = "dub-core"
database_id = "00000000-0000-0000-0000-000000000000" # placeholder; infra sets the real id
migrations_dir = "migrations"

# DTO short-lived cache (テーマ: gantt:dto:<eventId>, TTL 60s).
[[kv_namespaces]]
binding = "GANTT_KV"
id = "00000000000000000000000000000000" # placeholder; infra sets the real id

# Inbound event queue (cache purge). DLQ + max_retries per Queue catalog common values.
[[queues.consumers]]
queue = "dub-q-evt-gantt"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 5
dead_letter_queue = "dub-q-evt-gantt-dlq"

# Upstream services via Service Bindings (read-only: task/event; authz: identity).
[[services]]
binding = "SVC_TASK"
service = "task-service"

[[services]]
binding = "SVC_EVENT"
service = "event-service"

[[services]]
binding = "SVC_IDENTITY"
service = "identity-roster"

# ── Realtime (DO + WS) ────────────────────────────────────────────────────────
# The gantt-owned GanttRoom Durable Object. One instance per event (getByName(eventId));
# it verifies ws-tickets (HMAC) + Origin and fans GanttRealtimeEvent deltas out to the
# connected sockets. WS is gateway-bypassing / DO-direct. SQLite-backed DOs run on the
# free plan; GanttRoom holds no durable rows (WS coordinator only) so cost stays $0.
[[durable_objects.bindings]]
name = "GANTT_ROOM"
class_name = "GanttRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GanttRoom"]

[observability]
enabled = true

[vars]
# Absolute base for the ws-ticket doUrl (DO-direct). ":id" -> eventId. Per-env override.
GANTT_RT_DO_URL_BASE = "wss://dub-gantt-service.developershub-site.workers.dev/ws/:id"
# Origin allow-list enforced by the GanttRoom DO (comma-separated).
GANTT_RT_ALLOWED_ORIGINS = "https://dub-fe2-app-shell.developershub-site.workers.dev,https://app.developershub.jp"

# NOTE: WS_TICKET_SECRET is a Worker Secret (never in wrangler.toml). Set via
# `wrangler secret put WS_TICKET_SECRET`. The GanttRoom DO verifies with the same secret.
