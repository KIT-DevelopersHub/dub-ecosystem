# Free-tier deploy of lp-analytics as `dub-lp-analytics` (internal; reached only via the
# api-gateway SVC_LP_ANALYTICS service binding — workers.dev disabled).
#
# Deploy (deploy-prod.sh が api-gateway より前に流す):
#   one-time: apply the lp namespace migration on dub-core
#   npx wrangler d1 execute dub-core --remote --file infra/d1/migrations/lp/0001_init.sql
#   npx wrangler deploy --config services/lp-analytics/wrangler.free.toml
name = "dub-lp-analytics"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

[observability]
enabled = true

# Shared dub-core D1: lp_* namespace tables.
[[d1_databases]]
binding = "DB"
database_name = "dub-core"
database_id = "d663f9c6-499f-4c67-910d-e08733d5278d"

[[services]]
binding = "SVC_IDENTITY"
service = "dub-identity-roster"   # POST /authz/check (app:lp:view / app:lp:edit)

[vars]
DUB_DEFAULT_ORG_ID = "org_devhub"
LP_BASE_URL = "https://hokuriku-it-conf.com"
# Cloudflare Web Analytics (LP のサイト全体アクセス)。トークンは secret:
#   npx wrangler secret put CF_ANALYTICS_TOKEN   (Account Analytics:Read)
CF_ACCOUNT_ID = "b8f6ddbf8fa8cf4e421eae870bdb6dac"
LP_WEB_ANALYTICS_SITE_TAG = "b1f4a5ab461a42dcb22c9ae37984d634"
# チケット購入 (Stripe Checkout)。secret が無ければ「決済準備中」(有料券 503・無料券はクーポンで動く):
#   npx wrangler secret put STRIPE_SECRET_KEY       (sk_live_... / sk_test_...)
#   npx wrangler secret put STRIPE_WEBHOOK_SECRET   (whsec_... 公開 LP の /tickets/stripe-webhook 用)
# migration: npx wrangler d1 execute dub-core --remote --file infra/d1/migrations/lp/0003_tickets.sql
#            npx wrangler d1 execute dub-core --remote --file infra/d1/migrations/lp/0005_ticket_payment_safety.sql
#            npx wrangler d1 execute dub-core --remote --file infra/d1/migrations/lp/0006_ticket_review_and_client.sql
#            npx wrangler d1 execute dub-core --remote --file infra/d1/migrations/lp/0007_ticket_coupons.sql
#   ORDER: apply 0005 / 0006 / 0007 BEFORE deploying code that uses them (checkout INSERTs client_key; without
#   it every checkout 500s). The deploy.yml D1 schema gate blocks the deploy otherwise. ALTER ADD COLUMN
#   is not re-runnable: if an apply fails midway, check PRAGMA table_info(lp_ticket_orders) and add the rest.
# LP_DAILY_CHECKOUT_CAP = "300"   # 1 日 (JST) の checkout 作成上限（既定 300）

# --- Ticket payment reconcile via a Durable Object ALARM, NOT a Cron Trigger. The account is at
# the Workers FREE plan's 5/5 cron cap (a 6th cron makes CF reject this deploy); a DO alarm does
# not count against it. Same pattern as github-sync's GithubReconcileDO. No manual bootstrap:
# every paid checkout arms the loop (src/reconcile-do.ts), then it reschedules itself every 10 min.
[[durable_objects.bindings]]
name = "TICKET_RECONCILE_DO"
class_name = "TicketReconcileDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TicketReconcileDO"]   # SQLite-backed DO is available on the Workers Free plan
