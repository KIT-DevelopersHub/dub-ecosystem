# api-gateway — Cloudflare Worker (single external HTTP entrypoint: api.developershub.jp).
# Deployment is NOT performed here (P0). This is the frozen binding topology only.
name = "dub-api-gateway"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# ---- vars (non-secret) ----
[vars]
GATEWAY_VERSION = "0.1.0"
# comma-separated; dev localhost origins included for local SPA work.
ALLOWED_ORIGINS = "https://app.developershub.jp,http://localhost:5173,http://localhost:3000"
DEFAULT_MAX_BODY_BYTES = "10485760"    # 10 MiB default request body cap
FILES_MAX_BODY_BYTES = "26214400"      # 25 MiB for /api/v1/files/* (file-meta 8-6 numeric agreement)
# Rate-limit policy (optional; defaults 100 / 60000ms when unset). Wire-signal only — see §7.
RATE_LIMIT_MAX = "100"
RATE_LIMIT_WINDOW_MS = "60000"

# ---- secrets (set via `wrangler secret put`, never committed) ----
# TURNSTILE_SECRET  -> public inquiry siteverify

# ---- Service Bindings (transparent routing + BFF/me composition) ----
# gantt-calc / mail-gateway / mail-automation are internal-only (registered in the
# infra binding registry, never routed by the gateway) and intentionally omitted.
[[services]]
binding = "SVC_AUTH"
service = "auth-service"

[[services]]
binding = "SVC_IDENTITY"
service = "identity-roster"

[[services]]
binding = "SVC_EVENT"
service = "event-service"

[[services]]
binding = "SVC_TASK"
service = "task-service"

[[services]]
binding = "SVC_GANTT"
service = "gantt-service"

[[services]]
binding = "SVC_NOTIFICATION"
service = "notification"

[[services]]
binding = "SVC_FILE_META"
service = "dub-file-meta"

[[services]]
binding = "SVC_DRIVE_PROXY"
service = "dub-drive-proxy"

[[services]]
binding = "SVC_DRIVE_SHARE"
service = "dub-drive-share-service"

[[services]]
binding = "SVC_CHAT"
service = "chat-service"

[[services]]
binding = "SVC_MAIL_GATEWAY"
service = "mail-gateway"

[[services]]
binding = "SVC_DEPLOY"
service = "dub-deploy-service"

[[services]]
binding = "SVC_GITHUB_SYNC"
service = "dub-github-sync"

[[services]]
binding = "SVC_AUDIT_LOG"
service = "audit-log"

[[services]]
binding = "SVC_WEBHOOK_INGEST"
service = "dub-webhook-ingest"

[[services]]
binding = "SVC_USAGE_METER"
service = "usage-meter"

[[services]]
binding = "SVC_MEMBER"
service = "member-service"

# ---- Queue producer (the single publish exception: public.inquiry.received) ----
[[queues.producers]]
binding = "EVT_NOTIFICATION"
queue = "dub-q-evt-notification"

[observability]
enabled = true

# ---- Rate limiting ----
# The code path is live: bind a shared KV namespace as RATE_LIMIT_KV and the gateway
# upgrades from the per-isolate in-memory fallback to a cross-isolate fixed-window
# limiter automatically (no code change, no contract change). Left commented here
# because the namespace id is infra-provisioned (this repo performs no deploy); infra
# fills `id`/`preview_id` in the binding registry.
# [[kv_namespaces]]
# binding = "RATE_LIMIT_KV"
# id = "<infra-provisioned>"
# preview_id = "<infra-provisioned>"
#
# Alternative R1 path — CF native Rate Limiting binding. It returns only { success },
# so it cannot emit the exact RateLimit-Remaining/Reset signals the contract (§7)
# requires; the KV limiter above is preferred for full wire-signal fidelity.
# [[unsafe.bindings]]
# name = "RATE_LIMITER"
# type = "ratelimit"
