# chat-service Worker. Bindings are declared and wired in code; deploy is out of
# scope for this unit (P0b: no deploy until the integration wave). Only the Apply-
# time IDs remain placeholders (database_id / queue ids / account_id), marked
# REPLACE_AT_APPLY and filled by infra.
#
# Boundary note (design 4-8 / theme11): this Worker is the conversation MASTER
# (HTTP: channels/threads/messages + chat_* D1 + chat.* Queue publish). The
# realtime side (ChatRoom DO: WS fanout / presence / ws-ticket verify) is chat-
# owned and REAL-WIRED here: the CHAT_ROOM DO namespace is bound below and routed
# via DoRealtimePublisher (src/realtime.ts) / the /ws upgrade in src/index.ts.
# Co-hosted with the HTTP master for P0; production may split the DO into a
# dedicated `chat-rt` Worker (CHAT_RT_DO_URL_BASE) via a cross-script binding —
# the DO class and the RealtimePublisher contract are unchanged.
name = "chat-service"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# Shared core D1 (single DB, namespace = chat_*). DDL is draft until 9-C freeze;
# physical migration lives in infra/d1/migrations/chat/0001_init.sql (owned by
# infra-d1-seed #28 — not created here to respect unit boundaries).
[[d1_databases]]
binding = "DB"
database_name = "dub-core"
database_id = "REPLACE_AT_APPLY"

# Realtime (9-C): the chat-owned ChatRoom Durable Object. One instance per channel
# (getByName(channelId)). It verifies ws-tickets (HMAC) + Origin and fans out
# ChatRealtimeEvent to connected sockets. WS is gateway-bypassing / DO-direct.
# Co-hosted with the HTTP master here for P0; production may move it to a dedicated
# `chat-rt` Worker addressed by CHAT_RT_DO_URL_BASE via a cross-script binding.
[[durable_objects.bindings]]
name = "CHAT_ROOM"
class_name = "ChatRoom"

# SQLite-backed DO class registration (required to create the DO). ChatRoom holds
# no durable rows in P0 (WS coordinator only); the migration still registers it.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChatRoom"]

# Service Bindings (Service-to-Service, x-dub-* propagation via @dub/http).
[[services]]
binding = "SVC_IDENTITY"
service = "identity-roster"

[[services]]
binding = "SVC_EVENT"
service = "event-service"

[[services]]
binding = "SVC_FILE_META"
service = "dub-file-meta"

# Producer queues (chat.* fan-out targets — dub-q- prefix). The chat.* rows are
# △ in the frozen catalog (active after 9-C); the only subscriber is notification.
[[queues.producers]]
binding = "EVT_NOTIFICATION"
queue = "dub-q-evt-notification"

[[queues.producers]]
binding = "AUDIT_QUEUE"
queue = "dub-q-audit-record"

[observability]
enabled = true

[vars]
DUB_DEFAULT_ORG_ID = "org_devhub"
# Absolute base for the ws-ticket doUrl (gateway-bypassing / DO-direct). ":id" is
# replaced with the channel id. Overridden per environment at Apply.
CHAT_RT_DO_URL_BASE = "wss://chat-rt.developershub.jp/ws/:id"
# Origin allow-list enforced by the ChatRoom DO (comma-separated). Browser clients
# must match; native/mobile clients send no Origin and are allowed.
CHAT_RT_ALLOWED_ORIGINS = "https://app.developershub.jp"

# NOTE: WS_TICKET_SECRET is a Worker Secret (never in wrangler.toml). Set via
# `wrangler secret put WS_TICKET_SECRET` at Apply. The ChatRoom DO verifies with
# the same secret (chat self-owned HMAC, theme11).
