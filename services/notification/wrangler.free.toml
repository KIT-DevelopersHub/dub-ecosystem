# Free-tier deploy of notification as `dub-notification-service` (internal; reached via
# the api-gateway SVC_NOTIFICATION binding — workers.dev disabled). This is the name the
# gateway routes /api/v1/notifications and /api/v1/feedback to.
#
# NO paid Cloudflare Queues (free tier). Two Queue channels are involved:
#   * publishAudit producer (AUDIT_QUEUE): delivery-failed audit records. This is now
#     REPLACED by a @dub/freeq D1 outbox (freeq_outbox on the shared dub-core DB, bound as
#     OUTBOX_DB). deps.ts falls back to the outbox shim when AUDIT_QUEUE is absent, so
#     audit records are durably persisted — no longer silently dropped — and the daily
#     Cron drain (scheduled handler) forwards them to audit-log over SVC_AUDIT
#     (/internal/audit-async). This closes the free-tier audit degrade.
#   * domain-event consumer (dub-q-evt-notification): the notification-delivery trigger,
#     NOT an audit path. It stays dormant on the free tier — free-ifying it would need
#     producer-side outbox writes in the services that publish domain events plus a
#     notification-side /internal/events-async drain (cross-service), which is out of
#     scope for this audit-focused change. The HTTP surface the live app uses (POST /notify
#     ingest, inbox reads, the feedback widget) is unaffected.
#
# Deploy:
#   export CLOUDFLARE_API_TOKEN=$(cat ~/Desktop/cf-token.txt)
#   # one-time: apply the feedback table + the freeq audit outbox table to dub-core (both idempotent)
#   npx wrangler d1 execute dub-core --remote \
#     --file services/notification/db/0002_feedback.sql
#   npx wrangler d1 execute dub-core --remote \
#     --file services/notification/db/0003_freeq_outbox.sql
#   npx wrangler deploy --config services/notification/wrangler.free.toml
name = "dub-notification-service"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

[observability]
enabled = true

# Shared dub-core D1 (notif_ namespace only). REAL dub-core id (verified via
# `wrangler d1 list`): d663f9c6-… . (60a9b8ab-… is the separate `auth-outbox` DB.)
[[d1_databases]]
binding = "DB"
database_name = "dub-core"
database_id = "d663f9c6-499f-4c67-910d-e08733d5278d"

# @dub/freeq audit outbox. Same physical dub-core D1 as `DB`, bound separately as infra
# plumbing for the un-namespaced freeq_outbox table (create it once with db/0003…sql).
[[d1_databases]]
binding = "OUTBOX_DB"
database_name = "dub-core"
database_id = "d663f9c6-499f-4c67-910d-e08733d5278d"

# --- Service Bindings (all live free-tier workers) ---
[[services]]
binding = "SVC_IDENTITY"
service = "dub-identity-roster"   # GET /users/:id (email), GET /users?roleKey= + /authz/check

[[services]]
binding = "SVC_EVENT"
service = "dub-event-service"     # GET /events/:id/participants (eventId expansion)

[[services]]
binding = "SVC_MAIL_GATEWAY"
service = "dub-mail-gateway"      # POST /send — best-effort feedback admin alert

[[services]]
binding = "SVC_CHAT"
service = "dub-chat-service"      # POST /internal/system-messages (ChatAdapter)

# audit-log service binding: the drain forwards outbox rows to POST /internal/audit-async.
[[services]]
binding = "SVC_AUDIT"
service = "dub-audit-log"

# Daily Cron (03:00 UTC): the scheduled handler runs retention purge (inbox 90d /
# deliveries 30d / processed 7d) AND drains the @dub/freeq audit outbox on the same tick.
# The Workers FREE plan caps the account at 5 cron triggers, so this stays a single
# low-rate schedule (delivery-failed audit volume is small; rows stay durable between
# ticks and are never dropped).
[triggers]
crons = ["0 3 * * *"]
