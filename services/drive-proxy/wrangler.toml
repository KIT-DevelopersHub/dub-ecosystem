# drive-proxy — Cloudflare Worker. The composition root (src/index.ts) wires REAL deps
# (real Google client + real OAuth refresh-token provider + real KV/queues/authz).
# Not yet deployed: what is outstanding is apply-time provisioning ONLY — the KV
# namespace id below + the GOOGLE_OAUTH_* secrets — not code wiring.
# Owns NO D1 (binding name DB is intentionally absent). Holds KV + Queues + secrets only.
name = "dub-drive-proxy"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

# --- KV: Google token cache + short-TTL response cache + rate counter (§3) ---
[[kv_namespaces]]
binding = "KV"
id = "REPLACE_AT_APPLY"          # standard apply-time placeholder (shared ecosystem
                                 # convention); `wrangler kv namespace create drive-proxy-cache`

# --- Producer queues (publish) ---
# drive.file.* -> file-meta consumer (binding name = @dub/events CONSUMER_QUEUE_BINDINGS["file-meta"])
[[queues.producers]]
binding = "EVT_FILE_META"
queue = "dub-q-evt-file-meta"

# write-op audit records (publishAudit special channel)
[[queues.producers]]
binding = "AUDIT_QUEUE"
queue = "dub-q-audit-record"

# --- Consumer (P1 only): contract reservation for wh-google-drive.
# Declared here as documentation; the actual [[queues.consumers]] block stays
# commented until P1 Drive-watch is enabled (contract §8, §8-2 old#7).
# P1 seam (intentionally not built in v1): enabling Drive-watch requires a
# files.watch channel-registration path in this service that mints the
# X-Goog-Channel-Token which webhook-ingest's verifyGoogleDrive
# (services/webhook-ingest/src/verify/stubs.ts) checks against its `driveTokens`
# secret pool. Until that P1 path exists, no drive-proxy-issued channel token flows.
# [[queues.consumers]]
# queue = "dub-q-wh-google-drive"
# max_batch_size = 10

# --- Service Bindings ---
[[services]]
binding = "SVC_IDENTITY"
service = "dub-identity-roster"   # identity-roster /authz/check

# --- Tunable numbers (frozen semantics, values adjusted at P2 with real metrics) ---
[vars]
DRIVE_RATE_WINDOW_SECONDS = "100"
DRIVE_RATE_SOFT_LIMIT = "500"
DRIVE_CACHE_TTL_LIST_SECONDS = "60"
DRIVE_CACHE_TTL_FILE_SECONDS = "60"
DRIVE_CACHE_TTL_SHEET_SECONDS = "30"

# --- Secrets (set via `wrangler secret put`, never in this file) ---
# GOOGLE_OAUTH_CLIENT_ID
# GOOGLE_OAUTH_CLIENT_SECRET
# GOOGLE_OAUTH_REFRESH_TOKEN
