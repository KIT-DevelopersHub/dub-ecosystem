# Free-tier deploy of mail-gateway as `dub-mail-gateway` (internal; reached via the
# api-gateway SVC_MAIL_GATEWAY service binding). NO paid Cloudflare Queues: the audit +
# domain-event fan-out that used Queue producers (AUDIT_QUEUE / EVT_MAIL_AUTOMATION /
# EVT_NOTIFICATION) is now a @dub/freeq D1 outbox (freeq_outbox on the shared dub-core
# DB). deps.ts falls back to the outbox shim when the Queue bindings are absent, so no
# audit/event record is dropped; a Cron drain forwards audit rows to audit-log and
# defers domain events (durable/pending) until their consumer routes land.
#
# Deploy:
#   export CLOUDFLARE_API_TOKEN=$(cat ~/Desktop/cf-token.txt)
#   # one-time: create the outbox table on dub-core
#   npx wrangler d1 execute dub-core --remote \
#     --file services/mail-gateway/db/0003_freeq_outbox.sql
#   npx wrangler deploy --config services/mail-gateway/wrangler.free.toml
# Secrets (RESEND_API_KEY) are already set on the worker and persist across deploys.
name = "dub-mail-gateway"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

[observability]
enabled = true

# Shared dub-core D1: mail_ namespace tables + the un-namespaced freeq_outbox table.
[[d1_databases]]
binding = "DB"
database_name = "dub-core"
database_id = "d663f9c6-499f-4c67-910d-e08733d5278d"

# --- Attachment body store (R2 free tier 10GB). Metadata stays in D1 (mail_attachments);
# the file bytes live here. Create once: `wrangler r2 bucket create dub-mail-attachments`.
[[r2_buckets]]
binding = "R2_MAIL"
bucket_name = "dub-mail-attachments"

# --- Service bindings (all targets are live free-tier workers) ---
[[services]]
binding = "SVC_IDENTITY"
service = "dub-identity-roster"   # POST /authz/check (mail:send / mail:read / mail:admin)

[[services]]
binding = "SVC_AUDIT"
service = "dub-audit-log"         # free-tier outbox drain -> POST /internal/audit-async

# --- Cron: daily (03:20 UTC). The scheduled handler drains the outbox on every tick
# and additionally runs the retention purge on the "20 3 * * *" tick. The Workers FREE
# plan caps the account at 5 cron triggers, so we reuse this one existing schedule for
# both the drain and the purge instead of adding an every-minute drain trigger. ---
[triggers]
crons = ["20 3 * * *"]

# --- Outbound provider (Resend, ADR-0001). Matches the live secret set (RESEND_API_KEY).
# developershub.jp is DKIM/SPF-verified in Resend (2026-08-11), so MAIL_FROM_ADDRESS is
# the company domain and real delivery to arbitrary recipients is unlocked. ---
[vars]
MAIL_OUTBOUND_PROVIDER = "resend"
SES_REGION = "ap-northeast-1"
MAIL_FROM_ADDRESS = "info@developershub.jp"
# Compliance archive: every outbound send is auto-CC'd here. Pair with a CF Email Routing
# rule (matcher=archive@developershub.jp, action=worker:dub-mail-gateway) so the archived
# copy is ingested back and visible to mail:read_all (oversight) holders. See README.
MAIL_ARCHIVE_CC = "archive@developershub.jp"
MAIL_SEND_MAX_ATTEMPTS = "3"
MAIL_SEND_TIMEOUT_MS = "15000"
MAIL_RATE_LIMIT_COOLDOWN_SEC = "60"
# Email Routing admin (address issuance). The token is a Workers Secret set out-of-band
# (wrangler secret put CF_EMAIL_ROUTING_TOKEN); the ids/zone/worker below are non-secret.
# CF_EMAIL_ROUTING_ZONE_ID / CF_EMAIL_ROUTING_ACCOUNT_ID are provisioned on the worker
# out-of-band (dashboard/secret). WORKER_NAME = this deployed Worker (email Worker target
# for issued receiving addresses); it defaults to dub-mail-gateway in code when unset.
CF_EMAIL_ROUTING_ZONE_NAME = "developershub.jp"
CF_EMAIL_ROUTING_WORKER_NAME = "dub-mail-gateway"
