# mail-gateway service (#15). Go-Live ready: outbound send (managed provider) works on
# the Workers FREE plan. Before `wrangler deploy` fill the two placeholders below
# (D1 database_id from `wrangler d1 create`, and provider secrets — see [vars]), and
# provision the queues / Email-Routing rule per README.md "Go-Live runbook".
# NOTE: the Queue producer bindings below require Workers PAID only if you keep the
# audit/event fan-out; the send endpoint itself needs no Queue (README §Free-tier).
name = "dub-mail-gateway"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# Shared dub-core D1 (mail_ namespace only). database_id filled at infra Apply.
[[d1_databases]]
binding = "DB"
database_name = "dub-core"
database_id = "d663f9c6-499f-4c67-910d-e08733d5278d"

# --- Service Bindings (contract-only; real targets wired in the infra波) ---
[[services]]
binding = "SVC_IDENTITY"
service = "dub-identity-roster"      # POST /authz/check (mail:send / mail:read / mail:admin)

# --- Queue producers ---
# Domain events (frozen catalog): mail.message.received -> mail-automation,
# mail.message.sent / send_failed -> notification.
# [[queues.producers]]
# queue = "dub-q-evt-mail-automation"
# binding = "EVT_MAIL_AUTOMATION"

# [[queues.producers]]
# queue = "dub-q-evt-notification"
# binding = "EVT_NOTIFICATION"

# publishAudit channel (theme#13) — send success/failure audit records.
# [[queues.producers]]
# queue = "dub-q-audit-record"
# binding = "AUDIT_QUEUE"

# --- Inbound (9-B: Cloudflare Email Routing -> this Worker's email() handler) ---
# Bind at Apply: `wrangler.toml` email routing rule maps info@developershub.jp here.
# (Section commented out until the integration波 provisions the domain/rule.)
# send_email binding for outbound reply-through-CF is NOT used; outbound = managed
# provider (SES暫定) via Workers Secrets (SES_* / MAIL_FROM_ADDRESS).

# --- Outbound provider. Non-secret config only; credentials are Workers Secrets set
# out-of-band at Apply (NEVER committed — 機密はローカルのみ). See README.md "Go-Live
# runbook" for the full per-provider steps. Pick ONE provider:
#
#   Resend (fastest / free 100/day, 3000/mo — recommended first Go-Live):
#     MAIL_OUTBOUND_PROVIDER = "resend"   ;  wrangler secret put RESEND_API_KEY
#   Amazon SES (ADR-001 default; sandbox -> prod-access request):
#     MAIL_OUTBOUND_PROVIDER = "ses"      ;  wrangler secret put SES_ACCESS_KEY_ID
#                                            wrangler secret put SES_SECRET_ACCESS_KEY
#   MailChannels (API-key; requires a domain lockdown record):
#     MAIL_OUTBOUND_PROVIDER = "mailchannels" ; wrangler secret put MAILCHANNELS_API_KEY
#
# If the selected provider's secrets are absent the provider falls back to a LOUD stub
# (no silent drop) and GET /internal/health/ready returns 503 with the missing config.
[vars]
MAIL_OUTBOUND_PROVIDER = "resend"
SES_REGION = "ap-northeast-1"
MAIL_FROM_ADDRESS = "info@developershub.jp"
# Send resilience tuning (optional; defaults shown). Retries transient provider failures
# (network / timeout / 429 / 5xx) with backoff+jitter; deterministic 4xx fail fast.
MAIL_SEND_MAX_ATTEMPTS = "3"      # total attempts (1 try + 2 retries); range 1..6
MAIL_SEND_TIMEOUT_MS = "15000"    # per-attempt upstream timeout (ms); range 1000..120000
# How long after the last provider 429 GET /internal/status keeps reporting rateLimit.active
# (drives the admin "メール送信APIが制限中" banner). Range 5..86400.
MAIL_RATE_LIMIT_COOLDOWN_SEC = "60"

# Retention purge Cron (03:20 UTC daily): send_log 30d / inbound 30d.
[triggers]
crons = ["20 3 * * *"]

[observability]
enabled = true
