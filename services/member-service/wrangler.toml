# member-service Worker — PAID topology. account_id / database_id filled by infra at
# Apply. member-service is a plain proxied service (no queues / events): the shared
# dub-core D1 (member_* namespace) + identity-roster for authz are its only bindings.
#
# FREE-TIER deploy uses wrangler.free.toml (name = "dub-member-service").
name = "member-service"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# Shared core D1 (single DB, namespace = member_*).
[[d1_databases]]
binding = "DB"
database_name = "dub-core"
database_id = "REPLACE_AT_APPLY"

# Service Bindings (x-dub-* propagation via @dub/http).
[[services]]
binding = "SVC_IDENTITY"
service = "identity-roster"

# notification-service: 参加届が届いたら管理者へ POST /notify で in-app 通知（best-effort）。
[[services]]
binding = "SVC_NOTIFICATION"
service = "notification"

# mail-gateway (POST /send): 面談の案内メール。mail-gateway 側も SVC_MEMBER を持つ相互 binding で、
# どちらの Worker も既に存在するのでデプロイ順の制約は増えない。
[[services]]
binding = "SVC_MAIL_GATEWAY"
service = "mail-gateway"

# 目標管理の実績 (チームのタスク件数 / LP の訪問者数)。件数だけを内部 API から読む。
[[services]]
binding = "SVC_TASK"
service = "task-service"

[[services]]
binding = "SVC_LP_ANALYTICS"
service = "lp-analytics"

# R2 dub-file-attachments (chat-service / file-meta と同じ既存バケット): スポンサーの名刺写真
# (sponsor/cards/<cardId>)。無い環境では写真ルートだけ 503 で他は動く。
[[r2_buckets]]
binding = "SPONSOR_FILES"
bucket_name = "dub-file-attachments"

[observability]
enabled = true

[vars]
DUB_DEFAULT_ORG_ID = "org_devhub"
# 公開ページの起点 (面談の日程選択 URL)。api-gateway の APP_BASE_URL と同じ値。
APP_BASE_URL = "https://dub-fe2-app-shell.developershub-site.workers.dev"
