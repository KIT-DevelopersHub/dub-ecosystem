# event-service Worker — PAID topology (canonical Queue fan-out). Bindings mirror the
# design's dependencies; account_id / database_id / queue ids are filled by infra at
# Apply. The EVT_* / AUDIT_QUEUE producers below are the frozen catalog wiring the
# queue-wiring conformance test validates — keep them.
#
# FREE-TIER deploy uses wrangler.free.toml instead: no paid Queues; index.ts falls back
# to a @dub/freeq D1 outbox (freeq_outbox on dub-core) drained by a Cron Trigger. When
# these real Queue bindings ARE present they are used unchanged (no code change needed).
name = "event-service"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# Shared core D1 (single DB, namespace = event_*).
[[d1_databases]]
binding = "DB"
database_name = "dub-core"
database_id = "REPLACE_AT_APPLY"

# Service Bindings (Service-to-Service, x-dub-* propagation via @dub/http).
[[services]]
binding = "SVC_IDENTITY"
service = "identity-roster"

[[services]]
binding = "SVC_TASK"
service = "task-service"

# Producer queues (fan-out targets for event.* / action.* — frozen dub-q-evt-* names;
# queue names must match each consumer's [[queues.consumers]] and @dub/events bindings).
[[queues.producers]]
binding = "EVT_NOTIFICATION"
queue = "dub-q-evt-notification"

[[queues.producers]]
binding = "EVT_TASK"
queue = "dub-q-evt-task"

[[queues.producers]]
binding = "EVT_GANTT"
queue = "dub-q-evt-gantt"

[[queues.producers]]
binding = "EVT_FILE_META"
queue = "dub-q-evt-file-meta"

[[queues.producers]]
binding = "EVT_GITHUB_SYNC"
queue = "dub-q-evt-github-sync"

[[queues.producers]]
binding = "EVT_MOBILE_BFF"
queue = "dub-q-evt-mobile-bff"

[[queues.producers]]
binding = "AUDIT_QUEUE"
queue = "dub-q-audit-record"

[observability]
enabled = true

# --- AI digest + Q&A (#879). Feature flag OFF until the Mac mini arrives. ---
# EventDigestHub = DO-alarm scheduler (no new Cron: the account's 5-cron cap is full)
# + the relay the Mac mini dials OUT to. Inert while EVENT_AI_DIGEST_ENABLED != "1":
# the alarm is never armed and the agent upgrade is refused. Enabling steps:
# tools/event-digest-agent/README.md.
[[durable_objects.bindings]]
name = "DIGEST_HUB"
class_name = "EventDigestHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["EventDigestHub"]   # SQLite-backed DO is available on the Workers Free plan

[vars]
DUB_DEFAULT_ORG_ID = "org_devhub"
EVENT_AI_DIGEST_ENABLED = "0"   # #879: OFF until the Mac mini is installed
