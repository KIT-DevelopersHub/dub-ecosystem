# auth-service — Cloudflare Worker scaffold (P0: DO NOT DEPLOY from here).
# FREE-TIER config: no paid Cloudflare Queues. Audit is written to a small D1
# outbox (@dub/freeq) and forwarded to audit-log by a free Cron Trigger drain.
# Binding names (AUTH_KV / OUTBOX_DB / SVC_IDENTITY / SVC_AUDIT) follow the design;
# the infra binding-name registry may rename AUTH_KV -> KV_SESSION at Apply time
# (auth-service.md §8 #2) — mechanical rename when it lands.
name = "auth-service"
main = "src/index.ts"
compatibility_date = "2024-11-27"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

[observability]
enabled = true

# --- KV: sessions / oauth_state / revoked_user (id filled at infra Apply) ---
[[kv_namespaces]]
binding = "AUTH_KV"
id = "REPLACE_AT_APPLY"

# --- D1: audit outbox (@dub/freeq freeq_outbox). Its own small DB; free tier.
#     database_id filled at infra Apply. Apply db/0001_freeq_outbox.sql to create
#     the table (or call ensureOutbox() at deploy). ---
[[d1_databases]]
binding = "OUTBOX_DB"
database_name = "auth-outbox"
database_id = "REPLACE_AT_APPLY"

# --- Service binding: identity-roster (POST /users/provision) ---
[[services]]
binding = "SVC_IDENTITY"
service = "identity-roster"

# --- Service binding: audit-log (audit outbox drain delivery target) ---
# Retained for reference/back-compat; the audit outbox is now drained by the standalone
# freeq-drain worker (single aggregated cron), so this service no longer runs a drain cron.
[[services]]
binding = "SVC_AUDIT"
service = "audit-log"

# NOTE: the per-service drain Cron Trigger (was `crons = ["* * * * *"]`) was REMOVED. The
# freeq_outbox is drained centrally by the freeq-drain worker (services/freeq-drain), which
# holds the ONE freeq cron. Removing it here frees a cron slot on the free-plan account cap.

# --- vars (non-secret) ---
# Login is email+password only (web Google OAuth removed). Access is gated by the
# identity-roster ACTIVE allowlist (theme #4), NOT by email domain — so roster
# members on any domain (e.g. github-synced accounts) can log in. Set the optional
# ALLOWED_LOGIN_DOMAIN var to re-enable a coarse extra domain filter if ever wanted.
[vars]
ENVIRONMENT = "production"
COOKIE_DOMAIN = ".developershub.jp"
SESSION_ACCESS_TTL_SEC = "3600"
SESSION_ABS_WEB_TTL_SEC = "2592000"
SESSION_ABS_MOBILE_TTL_SEC = "15552000"

# Secrets (set via `wrangler secret put`, never committed):
#   PASSWORD_ENC_KEY  — base64 of 32 random bytes (AES-256-GCM). Enables admin
#                       password view (#5c) + encrypted-at-rest copies. Generate with:
#                         openssl rand -base64 32
#   GOOGLE_MOBILE_IOS_CLIENT_ID / GOOGLE_MOBILE_ANDROID_CLIENT_ID  — MOBILE Google only.
# test-login is gated by DUB_TEST_LOGIN="1" and only in local/preview envs.

[env.preview.vars]
ENVIRONMENT = "preview"
DUB_TEST_LOGIN = "1"

[env.local.vars]
ENVIRONMENT = "local"
DUB_TEST_LOGIN = "1"
COOKIE_DOMAIN = "localhost"
