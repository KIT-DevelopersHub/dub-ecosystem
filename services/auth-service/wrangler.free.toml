# Free-tier deploy of auth-service as `dub-auth-service` (internal; reached only via
# the api-gateway SVC_AUTH service binding — workers.dev disabled).
# Mirrors the live worker's bindings (KV + SVC_IDENTITY, NO Queues).
# Login is now email+password only, restricted to ALLOWED_LOGIN_DOMAIN
# (developershub.jp). Web Google OAuth was removed, so the SPA redirect/allowlist +
# oauth-state vars are gone. COOKIE_DOMAIN stays UNSET -> host-only session cookie
# (a shared .developershub.jp Domain attribute is rejected by the browser on
# workers.dev). Audit is best-effort (no AUDIT_QUEUE binding).
#
# Deploy:
#   export CLOUDFLARE_API_TOKEN=$(cat ~/Desktop/cf-token.txt)
#   npx wrangler deploy --config services/auth-service/wrangler.free.toml
name = "dub-auth-service"
main = "src/index.ts"
compatibility_date = "2024-11-27"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

[observability]
enabled = true

[[kv_namespaces]]
binding = "AUTH_KV"
id = "71e10ff553a24e0aa0b89929f6ed8643"

# Free-tier audit outbox (@dub/freeq): replaces the paid AUDIT_QUEUE producer.
# Best-effort — auth flow never fails on an outbox INSERT hiccup. Drain to
# audit-log is a follow-up (Cron + SVC_AUDIT); rows stay durable in D1 until then.
[[d1_databases]]
binding = "OUTBOX_DB"
database_name = "auth-outbox"
database_id = "60a9b8ab-5904-4c1e-8821-e43e0192ce43"

[[services]]
binding = "SVC_IDENTITY"
service = "dub-identity-roster"

[vars]
ENVIRONMENT = "production"
# COOKIE_DOMAIN intentionally UNSET -> host-only cookie on the gateway origin.
ALLOWED_LOGIN_DOMAIN = "developershub.jp"
SESSION_ACCESS_TTL_SEC = "3600"
SESSION_ABS_WEB_TTL_SEC = "2592000"
SESSION_ABS_MOBILE_TTL_SEC = "15552000"
